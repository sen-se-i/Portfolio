<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VALORANT // FAHIM AHAMMAD TANVIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('valorant_font/Valorant Font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-white: #ffffff;
      --val-cyan: #00f5d4;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-dark);
      overflow: hidden;
      font-family: 'Valorant', sans-serif;
      position: relative;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.18) 3px,
        rgba(0, 0, 0, 0.18) 4px
      );
      pointer-events: none;
      z-index: 950;
    }

    /* Start / Splash overlay for 1-Click Audio Unlock */
    #start-splash {
      position: fixed;
      inset: 0;
      background: var(--val-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #start-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-play-box {
      border: 1px solid rgba(255, 70, 85, 0.5);
      padding: 24px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 70, 85, 0.05);
      position: relative;
    }
    .splash-play-box::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 10px; height: 10px;
      border-top: 3px solid var(--val-red);
      border-left: 3px solid var(--val-red);
    }
    .splash-play-box::after {
      content: '';
      position: absolute;
      bottom: -3px; right: -3px;
      width: 10px; height: 10px;
      border-bottom: 3px solid var(--val-red);
      border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-size: 28px;
      letter-spacing: 0.25em;
      color: var(--val-white);
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ============================================================
       PHASE 1: GEOMETRIC SHAPE BURST & KINETIC SLICES (7s - 10s)
       ============================================================ */
    #phase-1-burst {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      pointer-events: none;
    }
    .burst-poly {
      position: absolute;
      background: var(--val-red);
      will-change: clip-path, opacity, transform;
    }
    #poly-1 {
      inset: 0;
      clip-path: polygon(0 0, 100% 0, 40% 100%, 0% 100%);
    }
    #poly-2 {
      inset: 0;
      clip-path: polygon(60% 0, 100% 0, 100% 100%, 20% 100%);
      background: #e83a48;
    }
    #poly-3 {
      inset: 0;
      clip-path: polygon(30% 20%, 80% 0%, 100% 70%, 50% 100%);
    }

    /* Floating HUD markers */
    .hud-label {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.35em;
      color: rgba(255, 255, 255, 0.7);
      z-index: 60;
    }
    .hud-tl { top: 30px; left: 40px; }
    .hud-tr { top: 30px; right: 40px; }
    .hud-bl { bottom: 30px; left: 40px; }
    .hud-br { bottom: 30px; right: 40px; }

    /* ============================================================
       PHASE 2: OPPOSING KINETIC SCROLL BANDS (10s - 13s)
       ============================================================ */
    #phase-2-bands {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      flex-direction: column;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }
    .scroll-row {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      display: flex;
    }
    .scroll-track {
      display: flex;
      font-size: clamp(100px, 14vw, 190px);
      line-height: 0.95;
      color: var(--val-red);
      letter-spacing: 0.12em;
      will-change: transform;
    }
    .track-left {
      animation: moveLeft 4s linear infinite;
    }
    .track-right {
      animation: moveRight 4s linear infinite;
    }
    @keyframes moveLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes moveRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    /* Small gap horizontal rule */
    .band-divider {
      width: 100%;
      height: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 10px 0;
    }
    .band-diamond {
      width: 10px;
      height: 10px;
      background: var(--val-red);
      transform: rotate(45deg);
    }

    /* ============================================================
       PHASE 3: DIAGONAL WIPE (13s - 14.5s)
       ============================================================ */
    #phase-3-wipe {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      pointer-events: none;
    }
    .wipe-blade {
      position: absolute;
      inset: 0;
      background: var(--val-red);
      clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
      transition: clip-path 0.38s cubic-bezier(0.7, 0, 0.3, 1);
    }
    .wipe-blade.active {
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    /* ============================================================
       PHASE 4: VALORANT LOGO REVEAL (14.5s - 16s)
       ============================================================ */
    #phase-4-logo {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* SVG V Blades */
    .v-svg-wrap {
      width: 130px;
      height: 98px;
    }
    .v-path-left, .v-path-right {
      fill: var(--val-red);
      stroke: var(--val-red);
      stroke-width: 2;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      transition: stroke-dashoffset 0.45s ease-out;
    }
    .v-svg-wrap.draw .v-path-left {
      stroke-dashoffset: 0;
    }
    .v-svg-wrap.draw .v-path-right {
      stroke-dashoffset: 0;
      transition-delay: 0.15s;
    }

    .valorant-wordmark {
      font-size: 42px;
      letter-spacing: 0.22em;
      color: var(--val-red);
      margin-top: 14px;
      position: relative;
      overflow: hidden;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .valorant-wordmark.reveal {
      clip-path: inset(0 0 0 0);
    }

    .cyan-accent-bar {
      width: 28px;
      height: 3px;
      background: var(--val-cyan);
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .cyan-accent-bar.show {
      opacity: 1;
    }

    /* ============================================================
       PHASE 5: FULL NAME REVEAL (16s - 21s) - 100% PURE WHITE
       ============================================================ */
    #phase-5-name {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Full Name in pure Valorant Font & Pure White */
    .name-line {
      font-family: 'Valorant', sans-serif;
      font-size: clamp(32px, 4.2vw, 56px);
      letter-spacing: 0.24em;
      color: var(--val-white);
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      transition: opacity 0.35s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
    }
    .name-line.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .role-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.5em;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 14px;
      opacity: 0;
      transition: opacity 0.5s ease 0.4s;
      text-transform: uppercase;
    }
    .role-badge.show {
      opacity: 1;
    }

    /* Enter Portfolio and replay controls */
    .bottom-nav {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .bottom-nav.show {
      opacity: 1;
    }
    .nav-btn {
      background: rgba(15, 25, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: var(--val-red);
      border-color: var(--val-red);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Background Audio (reveal audio from shorts or existing cypher track fallback) -->
  <audio id="intro-audio" preload="auto">
    <source src="reveal_audio.webm" type="audio/webm" />
    <source src="cypher_audio.webm" type="audio/webm" />
  </audio>

  <div class="scanlines"></div>

  <!-- 1-CLICK AUDIO UNLOCK & START SPLASH -->
  <div id="start-splash">
    <div class="splash-play-box">
      <div class="splash-title">VALORANT</div>
      <div class="splash-sub">CLICK ANYWHERE TO INITIALIZE</div>
    </div>
  </div>

  <!-- HUD Markers -->
  <div class="hud-label hud-tl">// VLRNT // PRTCL_02</div>
  <div class="hud-label hud-tr">SYS.ONLINE // 2026</div>
  <div class="hud-label hud-bl">DEF // PROTOCOL</div>
  <div class="hud-label hud-br">LOC // SUST_CSE</div>

  <!-- PHASE 1: GEOMETRIC SHAPE BURST (7s - 10s) -->
  <div id="phase-1-burst">
    <div class="burst-poly" id="poly-1"></div>
    <div class="burst-poly" id="poly-2"></div>
    <div class="burst-poly" id="poly-3"></div>
  </div>

  <!-- PHASE 2: OPPOSING KINETIC SCROLL BANDS (10s - 13s) -->
  <div id="phase-2-bands">
    <div class="scroll-row">
      <div class="scroll-track track-left">
        VALORANT &nbsp; VALORANT &nbsp; VALORANT &nbsp; VALORANT &nbsp; VALORANT &nbsp;
      </div>
    </div>
    <div class="band-divider">
      <div class="band-diamond"></div>
      <div class="band-diamond"></div>
    </div>
    <div class="scroll-row">
      <div class="scroll-track track-right">
        VALORANT &nbsp; VALORANT &nbsp; VALORANT &nbsp; VALORANT &nbsp; VALORANT &nbsp;
      </div>
    </div>
  </div>

  <!-- PHASE 3: DIAGONAL WIPE BLADE (13s - 14.5s) -->
  <div id="phase-3-wipe">
    <div class="wipe-blade" id="wipe-blade"></div>
  </div>

  <!-- PHASE 4 & 5: LOGO + FULL NAME REVEAL -->
  <div id="phase-4-logo">
    <div class="logo-box">
      
      <!-- SVG Valorant V -->
      <svg class="v-svg-wrap" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Left Blade -->
        <path class="v-path-left" d="M12 8 L42 8 L72 72 L42 72 Z" />
        <!-- Right Blade -->
        <path class="v-path-right" d="M88 8 L58 8 L70 34 L100 34 Z" />
      </svg>

      <div class="valorant-wordmark" id="val-wordmark">VALORANT</div>
      <div class="cyan-accent-bar" id="cyan-bar"></div>

      <!-- Full Name in 100% Pure White & Valorant Font -->
      <div id="phase-5-name">
        <div class="name-line" id="name-full">FAHIM AHAMMAD TANVIR</div>
        <div class="role-badge" id="role-badge">SOFTWARE ENGINEER // SUST // FULL-STACK</div>
      </div>

    </div>
  </div>

  <!-- Bottom Navigation Buttons -->
  <div class="bottom-nav" id="bottom-nav">
    <button class="nav-btn" id="replay-btn">REPLAY</button>
    <button class="nav-btn" id="enter-btn">ENTER PORTFOLIO &rsaquo;</button>
  </div>

  <script>
    const audio = document.getElementById('intro-audio');
    const splash = document.getElementById('start-splash');
    const phase1 = document.getElementById('phase-1-burst');
    const phase2 = document.getElementById('phase-2-bands');
    const phase3 = document.getElementById('phase-3-wipe');
    const wipeBlade = document.getElementById('wipe-blade');
    const phase4 = document.getElementById('phase-4-logo');
    const vSvg = document.querySelector('.v-svg-wrap');
    const valWordmark = document.getElementById('val-wordmark');
    const cyanBar = document.getElementById('cyan-bar');
    const nameFull = document.getElementById('name-full');
    const roleBadge = document.getElementById('role-badge');
    const bottomNav = document.getElementById('bottom-nav');
    const enterBtn = document.getElementById('enter-btn');
    const replayBtn = document.getElementById('replay-btn');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    // 1-Click Audio Unlock & Run
    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      audio.currentTime = 0;
      audio.play().catch(e => console.log('Audio playback:', e));
      runProjectAAnimation();
    });

    async function runProjectAAnimation() {
      // Reset elements
      phase1.style.display = 'none';
      phase2.style.display = 'none';
      phase3.style.display = 'none';
      wipeBlade.classList.remove('active');
      phase4.style.display = 'none';
      vSvg.classList.remove('draw');
      valWordmark.classList.remove('reveal');
      cyanBar.classList.remove('show');
      nameFull.classList.remove('show');
      roleBadge.classList.remove('show');
      bottomNav.classList.remove('show');

      /* ============================================================
         PHASE 1: GEOMETRIC BURST & SLICE SHAPES (7s - 10s in trailer)
         ============================================================ */
      phase1.style.display = 'block';
      const poly1 = document.getElementById('poly-1');
      const poly2 = document.getElementById('poly-2');
      const poly3 = document.getElementById('poly-3');

      // Strobe cuts
      poly1.style.opacity = '1';
      poly2.style.opacity = '0';
      poly3.style.opacity = '0';
      await wait(180);

      poly1.style.opacity = '0';
      poly2.style.opacity = '1';
      await wait(220);

      poly2.style.opacity = '0';
      poly3.style.opacity = '1';
      await wait(200);

      poly1.style.opacity = '1';
      poly3.style.opacity = '0';
      await wait(240);

      phase1.style.display = 'none';

      /* ============================================================
         PHASE 2: OPPOSING SCROLL BANDS (10s - 13s)
         ============================================================ */
      phase2.style.display = 'flex';
      await wait(1600); // 1.6 seconds of kinetic text scroll
      phase2.style.display = 'none';

      /* ============================================================
         PHASE 3: DIAGONAL RED WIPE (13s - 14.5s)
         ============================================================ */
      phase3.style.display = 'block';
      await wait(30);
      wipeBlade.classList.add('active');
      await wait(380);
      phase3.style.display = 'none';

      /* ============================================================
         PHASE 4: VALORANT LOGO REVEAL (14.5s - 16s)
         ============================================================ */
      phase4.style.display = 'flex';
      await wait(50);
      vSvg.classList.add('draw'); // SVG path stroke draw
      await wait(350);

      valWordmark.classList.add('reveal'); // Wordmark wipe reveal
      await wait(200);
      cyanBar.classList.add('show');
      await wait(500);

      /* ============================================================
         PHASE 5: FULL NAME REVEAL (FAHIM AHAMMAD TANVIR - FULL WHITE)
         ============================================================ */
      nameFull.classList.add('show');
      roleBadge.classList.add('show');
      await wait(600);

      bottomNav.classList.add('show');
    }

    // Navigation
    function enterPortfolio() {
      document.body.style.transition = 'opacity 0.4s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 400);
    }

    enterBtn.addEventListener('click', enterPortfolio);
    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      runProjectAAnimation();
    });

    document.addEventListener('keydown', (e) => {
      if (bottomNav.classList.contains('show')) enterPortfolio();
    });
  </script>
</body>
</html>
