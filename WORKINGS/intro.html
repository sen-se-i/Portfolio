<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VALORANT // FAHIM AHAMMAD TANVIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-white: #ece8e1;
      --val-cyan: #00f5d4;
      --val-box-bg: #bcc2cd;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-dark);
      overflow: hidden;
      font-family: 'Bebas Neue', sans-serif;
      position: relative;
    }

    /* Screen Flash Overlay */
    #flash-overlay {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.05s ease;
    }

    /* Fullscreen Invert Red Overlay (Phase 4) */
    #red-invert-overlay {
      position: fixed;
      inset: 0;
      background: var(--val-red);
      opacity: 0;
      pointer-events: none;
      z-index: 900;
    }

    /* CRT Scanlines and Grain */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.16) 3px,
        rgba(0, 0, 0, 0.16) 4px
      );
      pointer-events: none;
      z-index: 950;
    }

    /* Corner tactical crosshairs */
    .hud-marker {
      position: fixed;
      width: 8px;
      height: 8px;
      background: var(--val-red);
      z-index: 800;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .hud-marker.tl { top: 32px; left: 40px; }
    .hud-marker.tr { top: 32px; right: 40px; }
    .hud-marker.bl { bottom: 32px; left: 40px; }
    .hud-marker.br { bottom: 32px; right: 40px; }
    .hud-marker.tc { top: 32px; left: 50%; transform: translateX(-50%); }
    .hud-marker.bc { bottom: 32px; left: 50%; transform: translateX(-50%); }

    /* Tactical Subtext Header/Footer */
    .tactical-meta {
      position: fixed;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: rgba(236, 232, 225, 0.35);
      z-index: 800;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .tactical-meta.top-meta { top: 30px; left: 60px; }
    .tactical-meta.right-meta { top: 30px; right: 60px; text-align: right; }

    /* ====================================================
       STAGE CONTAINER
       ==================================================== */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      will-change: transform;
    }

    /* ====================================================
       PHASE 1: LINE SLICERS & LOGO
       ==================================================== */
    #phase-1-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 150;
    }

    .slash-bar {
      position: absolute;
      height: 12px;
      width: 0;
      transform-origin: center;
    }
    .slash-bar-red {
      background: var(--val-red);
      top: calc(50% - 6px);
      left: 10%;
    }
    .slash-bar-cyan {
      background: var(--val-cyan);
      top: calc(50% - 6px);
      right: 10%;
    }

    /* Initial Valorant V / FAT Emblem */
    #intro-emblem {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.85);
    }
    #intro-emblem svg {
      width: 80px;
      height: 60px;
      fill: var(--val-white);
      filter: drop-shadow(0 0 10px rgba(255, 70, 85, 0.6));
    }
    #intro-emblem .emblem-tag {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      letter-spacing: 0.5em;
      font-size: 14px;
      color: var(--val-red);
      margin-top: 14px;
    }

    /* ====================================================
       PHASE 2: VERTICAL WORDMARK BUILDING COLUMN
       ==================================================== */
    #phase-2-column {
      position: absolute;
      width: 50px;
      height: 65vh;
      overflow: hidden;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      z-index: 180;
    }
    .vert-slice {
      width: 100%;
      height: 20%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 110px;
      color: var(--val-white);
      overflow: hidden;
      line-height: 0.85;
      transform: scaleY(1.35);
      border-top: 1px solid rgba(0, 245, 212, 0.4);
      border-bottom: 1px solid rgba(255, 70, 85, 0.4);
    }

    /* ====================================================
       PHASE 3, 4, 5: 5-ROW STACKED HERO TYPOGRAPHY & AGENT
       ==================================================== */
    #hero-composition {
      position: relative;
      width: min(94vw, 1100px);
      height: 75vh;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      z-index: 200;
    }

    /* Light Grey Character Silhouette Backing Card */
    #agent-backdrop-card {
      position: absolute;
      top: 18%;
      right: 12%;
      width: 320px;
      height: 320px;
      background: var(--val-box-bg);
      z-index: 220;
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* 5 Staggered Rows */
    .hero-row {
      position: relative;
      width: 100%;
      height: 18%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 250;
    }

    /* Big White Cutting Bars / Slabs (from the trailer) */
    .white-slam-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--val-white);
      z-index: 240;
      opacity: 0;
      transform: translateX(-105%);
      will-change: transform;
    }
    .white-slam-bar.dir-left {
      left: 0;
      right: 0;
    }
    .white-slam-bar.dir-right {
      left: 0;
      right: 0;
      transform: translateX(105%);
    }

    /* Cyan Glitch Accent under bars */
    .cyan-edge {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 18px;
      background: var(--val-cyan);
      z-index: 245;
      display: none;
    }

    /* Row Text */
    .hero-text {
      position: relative;
      font-size: clamp(60px, 9.5vw, 136px);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: 0.08em;
      transform: scaleY(1.32);
      color: var(--val-white);
      white-space: nowrap;
      text-align: center;
      z-index: 260;
      opacity: 0;
      will-change: transform, opacity, filter;
    }

    /* Alternating row styling */
    .hero-row[data-row="0"] .hero-text { color: var(--val-white); }
    .hero-row[data-row="1"] .hero-text { color: var(--val-white); }
    .hero-row[data-row="2"] .hero-text { color: var(--val-white); }
    .hero-row[data-row="3"] .hero-text { color: var(--val-white); }
    .hero-row[data-row="4"] .hero-text { color: var(--val-white); }

    /* When red inverted phase triggers */
    body.is-red-phase #hero-composition {
      mix-blend-mode: normal;
    }
    body.is-red-phase .hero-text {
      color: var(--val-white) !important;
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
    }
    body.is-red-phase #agent-backdrop-card {
      background: #737882;
    }

    /* ====================================================
       AGENT CUTOUT OVERLAY
       ==================================================== */
    #agent-figure-wrap {
      position: absolute;
      top: 50%;
      left: 55%;
      transform: translate(-50%, -50%);
      width: 440px;
      height: 90vh;
      max-height: 800px;
      pointer-events: none;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      will-change: transform, opacity, filter;
    }

    #agent-figure-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.85));
    }

    /* Cyan Silhouette Echo of Agent (like 4.07s frame) */
    #agent-figure-silhouette {
      position: absolute;
      inset: 0;
      mask-image: url('cypher_cutout.png');
      -webkit-mask-image: url('cypher_cutout.png');
      mask-size: contain;
      -webkit-mask-size: contain;
      mask-repeat: no-repeat;
      -webkit-mask-repeat: no-repeat;
      mask-position: center;
      -webkit-mask-position: center;
      background: var(--val-cyan);
      opacity: 0;
      z-index: 295;
      transform: translate(6px, -4px);
    }

    /* ====================================================
       AUDIO BUTTON & SKIP CONTROLS
       ==================================================== */
    .nav-controls {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 1100;
    }

    .ctrl-btn {
      background: rgba(15, 25, 35, 0.6);
      border: 1px solid rgba(236, 232, 225, 0.3);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3em;
      padding: 8px 16px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      background: var(--val-red);
      border-color: var(--val-red);
      color: #fff;
    }

    #continue-prompt {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5em;
      color: rgba(236, 232, 225, 0.7);
      text-transform: uppercase;
      z-index: 1100;
      opacity: 0;
      pointer-events: none;
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Replay button */
    #replay-btn {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Audio track from Golden Moment -->
  <audio id="intro-audio" preload="auto">
    <source src="intro_audio.webm" type="audio/webm" />
    <source src="intro_audio.m4a" type="audio/mp4" />
  </audio>

  <!-- Overlays -->
  <div id="flash-overlay"></div>
  <div id="red-invert-overlay"></div>
  <div class="scanlines"></div>

  <!-- Tactical HUD markers -->
  <div class="hud-marker tl"></div>
  <div class="hud-marker tr"></div>
  <div class="hud-marker bl"></div>
  <div class="hud-marker br"></div>
  <div class="hud-marker tc"></div>
  <div class="hud-marker bc"></div>

  <div class="tactical-meta top-meta">// SEC_00:07 &bull; AGENT IDENTIFICATION</div>
  <div class="tactical-meta right-meta">SUST // CSE &bull; PROTOCOL 2026</div>

  <!-- Stage Canvas -->
  <div id="stage">

    <!-- Phase 1: Slashes and Emblem -->
    <div id="phase-1-layer">
      <div class="slash-bar slash-bar-red" id="slash-red"></div>
      <div class="slash-bar slash-bar-cyan" id="slash-cyan"></div>

      <div id="intro-emblem">
        <!-- Valorant Style Emblem -->
        <svg viewBox="0 0 100 80">
          <polygon points="5,5 45,5 35,75 5,75" />
          <polygon points="55,5 95,5 95,75 65,75" />
        </svg>
        <div class="emblem-tag">[ FAHIM AHAMMAD TANVIR ]</div>
      </div>
    </div>

    <!-- Phase 2: Vertical Wordmark Distortion Column -->
    <div id="phase-2-column">
      <div class="vert-slice">F</div>
      <div class="vert-slice">A</div>
      <div class="vert-slice">H</div>
      <div class="vert-slice">I</div>
      <div class="vert-slice">M</div>
    </div>

    <!-- Phase 3, 4, 5: 5-Row Kinetic Hero Stack -->
    <div id="hero-composition">
      <div id="agent-backdrop-card"></div>

      <!-- Row 0: FAHIM -->
      <div class="hero-row" data-row="0">
        <div class="white-slam-bar dir-left" id="bar-0"></div>
        <div class="cyan-edge" id="cyan-0"></div>
        <div class="hero-text" id="text-0">FAHIM</div>
      </div>

      <!-- Row 1: AHAMMAD -->
      <div class="hero-row" data-row="1">
        <div class="white-slam-bar dir-right" id="bar-1"></div>
        <div class="cyan-edge" id="cyan-1"></div>
        <div class="hero-text" id="text-1">AHAMMAD</div>
      </div>

      <!-- Row 2: TANVIR -->
      <div class="hero-row" data-row="2">
        <div class="white-slam-bar dir-left" id="bar-2"></div>
        <div class="cyan-edge" id="cyan-2"></div>
        <div class="hero-text" id="text-2">TANVIR</div>
      </div>

      <!-- Row 3: AHAMMAD -->
      <div class="hero-row" data-row="3">
        <div class="white-slam-bar dir-right" id="bar-3"></div>
        <div class="cyan-edge" id="cyan-3"></div>
        <div class="hero-text" id="text-3">AHAMMAD</div>
      </div>

      <!-- Row 4: TANVIR -->
      <div class="hero-row" data-row="4">
        <div class="white-slam-bar dir-left" id="bar-4"></div>
        <div class="cyan-edge" id="cyan-4"></div>
        <div class="hero-text" id="text-4">TANVIR</div>
      </div>

      <!-- Agent Cutout Figure -->
      <div id="agent-figure-wrap">
        <div id="agent-figure-silhouette"></div>
        <img src="cypher_cutout.png" alt="Agent Cutout" id="agent-figure-img" />
      </div>

    </div>

  </div>

  <!-- Navigation / Controls -->
  <div class="nav-controls">
    <button class="ctrl-btn" id="audio-toggle-btn">SOUND: ON</button>
    <button class="ctrl-btn" id="replay-btn">REPLAY</button>
    <button class="ctrl-btn" id="enter-site-btn">ENTER PORTFOLIO &rsaquo;</button>
  </div>

  <div id="continue-prompt">PRESS ANY KEY OR CLICK TO ENTER</div>

  <script>
    /* ============================================================
       EXACT VALORANT "GOLDEN MOMENT" TRAILER CHOREOGRAPHY (7 SEC)
       ============================================================ */
    const audio = document.getElementById('intro-audio');
    const stage = document.getElementById('stage');
    const flashEl = document.getElementById('flash-overlay');
    const redOverlay = document.getElementById('red-invert-overlay');
    const continuePrompt = document.getElementById('continue-prompt');
    const replayBtn = document.getElementById('replay-btn');
    const audioToggleBtn = document.getElementById('audio-toggle-btn');
    const enterSiteBtn = document.getElementById('enter-site-btn');

    let audioMuted = false;
    let introFinished = false;

    // Fast screen flash
    function flash(opacity = 0.9, duration = 80) {
      flashEl.style.transition = 'none';
      flashEl.style.opacity = opacity;
      setTimeout(() => {
        flashEl.style.transition = `opacity ${duration}ms cubic-bezier(0.1, 0.9, 0.2, 1)`;
        flashEl.style.opacity = 0;
      }, 25);
    }

    // Camera shake
    function shake(intensity = 8, decay = 0.85) {
      let cur = intensity;
      const step = () => {
        if (cur < 0.6) {
          stage.style.transform = 'none';
          return;
        }
        const rx = (Math.random() - 0.5) * cur * 2;
        const ry = (Math.random() - 0.5) * cur * 2;
        stage.style.transform = `translate(${rx}px, ${ry}px)`;
        cur *= decay;
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    // Delay promise
    const wait = ms => new Promise(res => setTimeout(res, ms));

    // Audio toggle
    audioToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      audioMuted = !audioMuted;
      audio.muted = audioMuted;
      audioToggleBtn.innerText = audioMuted ? 'SOUND: OFF' : 'SOUND: ON';
    });

    // Enter site
    function enterPortfolio() {
      if (introFinished) {
        document.body.style.transition = 'opacity 0.4s ease, filter 0.4s ease';
        document.body.style.opacity = '0';
        document.body.style.filter = 'blur(10px)';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 400);
      }
    }

    enterSiteBtn.addEventListener('click', enterPortfolio);
    document.addEventListener('keydown', (e) => {
      if (introFinished) enterPortfolio();
    });
    document.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      if (introFinished) enterPortfolio();
    });

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetScene();
      runValorantIntro();
    });

    function resetScene() {
      introFinished = false;
      continuePrompt.style.opacity = 0;
      replayBtn.style.display = 'none';
      document.body.classList.remove('is-red-phase');
      redOverlay.style.opacity = 0;
      flashEl.style.opacity = 0;

      document.querySelectorAll('.hud-marker, .tactical-meta').forEach(el => el.style.opacity = 0);

      document.getElementById('phase-1-layer').style.display = 'flex';
      document.getElementById('slash-red').style.width = '0';
      document.getElementById('slash-cyan').style.width = '0';
      document.getElementById('intro-emblem').style.opacity = '0';

      const col = document.getElementById('phase-2-column');
      col.style.display = 'none';
      col.style.width = '50px';

      const heroComp = document.getElementById('hero-composition');
      heroComp.style.display = 'none';

      document.getElementById('agent-backdrop-card').style.opacity = 0;
      document.getElementById('agent-figure-wrap').style.opacity = 0;
      document.getElementById('agent-figure-silhouette').style.opacity = 0;

      for (let i = 0; i < 5; i++) {
        const bar = document.getElementById(`bar-${i}`);
        bar.style.opacity = 0;
        bar.style.transform = i % 2 === 0 ? 'translateX(-105%)' : 'translateX(105%)';
        const txt = document.getElementById(`text-${i}`);
        txt.style.opacity = 0;
        txt.style.transform = 'scaleY(1.32)';
      }
    }

    /* ============================================================
       MAIN SEQUENCER
       ============================================================ */
    async function runValorantIntro() {
      // Start audio
      audio.currentTime = 2.4; // sync directly with the logo build beat
      audio.play().catch(() => {
        console.log('Audio autoplay prevented, user can click to hear sound');
      });

      // Show HUD markers
      document.querySelectorAll('.hud-marker, .tactical-meta').forEach(el => el.style.opacity = 1);

      /* ----------------------------------------------------
         0:00 - 0:01.2s : Phase 1 - Slashes & V Emblem
         ---------------------------------------------------- */
      const sRed = document.getElementById('slash-red');
      const sCyan = document.getElementById('slash-cyan');
      const emblem = document.getElementById('intro-emblem');

      sRed.style.transition = 'width 0.18s cubic-bezier(0.2, 0.8, 0.2, 1)';
      sCyan.style.transition = 'width 0.18s cubic-bezier(0.2, 0.8, 0.2, 1)';
      sRed.style.width = '35vw';
      sCyan.style.width = '35vw';

      await wait(180);
      sRed.style.opacity = '0';
      sCyan.style.opacity = '0';

      flash(0.6, 60);
      shake(5);

      emblem.style.transition = 'all 0.15s cubic-bezier(0.1, 0.9, 0.2, 1)';
      emblem.style.opacity = 1;
      emblem.style.transform = 'scale(1)';

      await wait(500);

      // Flash glitch out emblem
      emblem.style.transition = 'all 0.08s ease';
      emblem.style.opacity = 0;
      emblem.style.transform = 'scale(1.15)';
      document.getElementById('phase-1-layer').style.display = 'none';

      /* ----------------------------------------------------
         0:01.2s - 0:02.4s : Phase 2 - Vertical Wordmark Column
         ---------------------------------------------------- */
      const col = document.getElementById('phase-2-column');
      col.style.display = 'flex';
      flash(0.8, 80);
      shake(8);

      // Rapid glitch jitter of column width (like 3.4s - 3.8s in video)
      const widths = [60, 90, 45, 120, 180, 260];
      for (let w of widths) {
        col.style.width = w + 'px';
        col.style.transform = `translate(${(Math.random()-0.5)*14}px, ${(Math.random()-0.5)*6}px)`;
        await wait(65);
      }

      col.style.display = 'none';

      /* ----------------------------------------------------
         0:02.4s - 0:04.2s : Phase 3 - 5-Row White Slam Slices
         ---------------------------------------------------- */
      const heroComp = document.getElementById('hero-composition');
      heroComp.style.display = 'flex';

      const agentWrap = document.getElementById('agent-figure-wrap');
      const agentSil = document.getElementById('agent-figure-silhouette');
      const agentCard = document.getElementById('agent-backdrop-card');

      // First slam on the 5 names one by one
      // Row names: FAHIM, AHAMMAD, TANVIR, AHAMMAD, TANVIR
      for (let i = 0; i < 5; i++) {
        const bar = document.getElementById(`bar-${i}`);
        const txt = document.getElementById(`text-${i}`);
        const cyan = document.getElementById(`cyan-${i}`);

        flash(0.5, 40);
        shake(7);

        // Bar slams across
        bar.style.opacity = 1;
        bar.style.transition = 'transform 0.12s cubic-bezier(0.1, 0.9, 0.2, 1)';
        bar.style.transform = 'translateX(0)';

        // Cyan accent flash
        cyan.style.display = 'block';
        cyan.style.left = (i % 2 === 0) ? '0' : 'calc(100% - 18px)';

        txt.style.opacity = 1;

        await wait(120);

        // White bar retracts to reveal text
        bar.style.transition = 'transform 0.16s cubic-bezier(0.8, 0, 0.2, 1), opacity 0.16s';
        bar.style.transform = (i % 2 === 0) ? 'translateX(105%)' : 'translateX(-105%)';
        bar.style.opacity = 0;
        cyan.style.display = 'none';
      }

      // Flash on cyan silhouette (Frame 4.07s)
      agentWrap.style.opacity = 1;
      agentSil.style.opacity = 1;
      agentWrap.style.transform = 'translate(-50%, -50%) scale(1.05)';
      shake(10);
      flash(0.7, 50);

      await wait(100);
      agentSil.style.opacity = 0;
      agentWrap.style.transform = 'translate(-50%, -50%) scale(1)';

      await wait(300);

      /* ----------------------------------------------------
         0:04.2s - 0:05.8s : Phase 4 - RED INVERT & AGENT POSTURE
         (Matches exact frame 5.20s - 6.20s)
         ---------------------------------------------------- */
      flash(1.0, 90);
      shake(14);
      document.body.classList.add('is-red-phase');
      redOverlay.style.opacity = 1;
      agentCard.style.opacity = 1;

      // Agent is positioned crisp in center-right
      agentWrap.style.transition = 'none';
      agentWrap.style.left = '58%';
      agentWrap.style.transform = 'translate(-50%, -50%) scale(1.03)';

      await wait(600);

      // Red phase flickers back to dark navy with agent locked in (Frame 6.20s)
      flash(0.9, 70);
      shake(9);
      document.body.classList.remove('is-red-phase');
      redOverlay.style.opacity = 0;
      agentCard.style.background = '#bcc2cd';

      /* ----------------------------------------------------
         0:05.8s - 0:07.0s : Phase 5 - Exit Whip Transition
         ---------------------------------------------------- */
      await wait(1200);

      // Horizontal white bars reverse-slice across (Frame 6.8s - 7.0s)
      for (let i = 0; i < 5; i++) {
        const bar = document.getElementById(`bar-${i}`);
        bar.style.opacity = 1;
        bar.style.transition = 'transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1)';
        bar.style.transform = (i % 2 === 0) ? 'translateX(0)' : 'translateX(0)';
      }
      shake(12);
      flash(0.8, 80);

      await wait(300);

      // Fade out bars and bring prompt
      for (let i = 0; i < 5; i++) {
        document.getElementById(`bar-${i}`).style.opacity = 0;
      }

      introFinished = true;
      continuePrompt.style.opacity = 1;
      replayBtn.style.display = 'inline-block';
    }

    // Auto run on load
    window.addEventListener('load', () => {
      setTimeout(runValorantIntro, 400);
    });

    // Button SFX
    const sfxHover = new Audio('hover.mp3');
    const sfxClick = new Audio('click button.mp3');
    document.querySelectorAll('.ctrl-btn, #continue-prompt').forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        try { const s = sfxHover.cloneNode(); s.volume = 0.35; s.play().catch(() => {}); } catch (_) {}
      });
      btn.addEventListener('click', () => {
        try { const s = sfxClick.cloneNode(); s.volume = 0.55; s.play().catch(() => {}); } catch (_) {}
      });
    });
  </script>
</body>
</html>
