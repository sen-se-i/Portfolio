<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VALORANT KINETIC // FAHIM AHAMMAD TANVIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('valorant_font/Valorant Font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #080d12;
      --val-slate: #0f1923;
      --val-white: #ffffff;
      --val-cyan: #00f5d4;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-dark);
      overflow: hidden;
      font-family: 'Valorant', sans-serif;
      position: relative;
    }

    /* Subtle CRT scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.22) 3px,
        rgba(0, 0, 0, 0.22) 4px
      );
      pointer-events: none;
      z-index: 950;
    }

    /* Grid layout guide lines for technical aesthetic */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 70, 85, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 70, 85, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 10;
    }

    /* 1-Click Audio Unlock & Start Gate */
    #start-splash {
      position: fixed;
      inset: 0;
      background: var(--val-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #start-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255, 70, 85, 0.4);
      padding: 28px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 70, 85, 0.04);
      position: relative;
    }
    .splash-box::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red);
      border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: '';
      position: absolute;
      bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red);
      border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-size: 32px;
      letter-spacing: 0.28em;
      color: var(--val-white);
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.45em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* Technical HUD markers */
    .hud {
      position: fixed;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.35em;
      color: rgba(255, 255, 255, 0.4);
      z-index: 50;
      pointer-events: none;
    }
    .hud-tl { top: 32px; left: 40px; }
    .hud-tr { top: 32px; right: 40px; }
    .hud-bl { bottom: 32px; left: 40px; }
    .hud-br { bottom: 32px; right: 40px; }

    /* ============================================================
       STAGE CONTAINER
       ============================================================ */
    #kinetic-stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    /* SVG Canvas for geometric stroke/letter assembly */
    .kinetic-svg {
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 720px;
      overflow: visible;
    }

    /* Letter Parts Style */
    .char-part {
      stroke: var(--val-cyan);
      fill: none;
      stroke-width: 18;
      stroke-linecap: butt;
      stroke-linejoin: miter;
      opacity: 0;
      transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity, stroke-dashoffset;
    }

    .char-part.filled {
      fill: var(--val-cyan);
    }

    .char-part.red-accent {
      stroke: var(--val-red);
      fill: none;
    }
    .char-part.red-accent.filled {
      fill: var(--val-red);
    }

    /* Assembled lock state */
    .char-part.locked {
      opacity: 1 !important;
      transform: translate(0, 0) scale(1) rotate(0deg) !important;
    }

    /* Glitch Slice Displacement */
    .glitch-active .char-part:nth-child(2n) {
      transform: translate(-12px, 0) !important;
      stroke: var(--val-red) !important;
    }
    .glitch-active .char-part:nth-child(2n+1) {
      transform: translate(12px, 0) !important;
      stroke: var(--val-white) !important;
    }

    /* ============================================================
       PHASE 3: FINAL VALORANT LOGO + FULL NAME REVEAL
       ============================================================ */
    #final-container {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    /* Valorant V blades */
    .v-logo-box {
      width: 140px;
      height: 105px;
      position: relative;
    }
    .v-blade {
      position: absolute;
      background: var(--val-red);
      will-change: transform, opacity;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Left blade: slides in from top-left diagonally */
    .v-blade-l {
      left: 10px;
      top: 10px;
      width: 48px;
      height: 90px;
      clip-path: polygon(0 0, 44% 0, 100% 100%, 56% 100%);
      transform: translate(-50px, -50px);
    }
    /* Right blade: slides in from top-right diagonally */
    .v-blade-r {
      right: 10px;
      top: 10px;
      width: 60px;
      height: 60px;
      clip-path: polygon(55% 0, 100% 0, 45% 100%, 0% 100%);
      transform: translate(50px, -50px);
    }
    .v-blade.assembled {
      opacity: 1;
      transform: translate(0, 0);
    }

    .v-cyan-slit {
      position: absolute;
      right: 14px;
      top: 10px;
      width: 22px;
      height: 60px;
      background: var(--val-cyan);
      clip-path: polygon(55% 0, 100% 0, 45% 100%, 0% 100%);
      opacity: 0;
      transition: opacity 0.1s;
    }

    .valorant-subtext {
      font-size: 38px;
      letter-spacing: 0.22em;
      color: var(--val-red);
      margin-top: 16px;
      opacity: 0;
      transform: scale(0.92);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .valorant-subtext.show {
      opacity: 1;
      transform: scale(1);
    }

    /* FULL NAME IN 100% PURE WHITE & VALORANT FONT */
    #full-name-reveal {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .name-full-text {
      font-family: 'Valorant', sans-serif;
      font-size: clamp(34px, 4.6vw, 62px);
      letter-spacing: 0.25em;
      color: var(--val-white);
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(14px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }
    .name-full-text.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .title-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.55em;
      color: rgba(255, 255, 255, 0.65);
      opacity: 0;
      transition: opacity 0.45s ease 0.3s;
    }
    .title-sub.show {
      opacity: 1;
    }

    /* Controls */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .nav-bar.show {
      opacity: 1;
    }
    .btn {
      background: rgba(15, 25, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-red);
      border-color: var(--val-red);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="reveal-audio" preload="auto">
    <source src="reveal_audio.webm" type="audio/webm" />
    <source src="cypher_audio.webm" type="audio/webm" />
  </audio>

  <div class="scanlines"></div>
  <div class="bg-grid"></div>

  <!-- 1-Click Audio Unlock Gate -->
  <div id="start-splash">
    <div class="splash-box">
      <div class="splash-title">VALORANT</div>
      <div class="splash-sub">CLICK TO INITIALIZE KINETIC ASSEMBLY</div>
    </div>
  </div>

  <!-- Technical HUD tags -->
  <div class="hud hud-tl">// VLRNT.SYS // KINETIC_OUTLINE</div>
  <div class="hud hud-tr">PROTOCOL_03 // ACTIVE</div>
  <div class="hud hud-bl">SHAPE_DECONSTRUCT // SVG_STROKE</div>
  <div class="hud hud-br">TARGET // FAHIM_AHAMMAD_TANVIR</div>

  <!-- STAGE 1: SVG Geometric Parts Transit & Assemble into Letters -->
  <div id="kinetic-stage">
    <svg class="kinetic-svg" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Linear Gradients for Cyan and Red Glow -->
        <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f5d4" />
          <stop offset="100%" stop-color="#00b4d8" />
        </linearGradient>
      </defs>

      <!-- =========================================================
           WORD: "AEVY" / KINETIC DECONSTRUCTED PARTS
           ========================================================= -->
      <g id="group-word-1">
        <!-- Letter 1: 'A' (Crossbar-less Valorant 'A' formed by 2 diagonal strokes + top cap) -->
        <!-- Left diagonal part: enters from top-left (-180px, -150px) -->
        <line id="w1-a-l" class="char-part" x1="200" y1="360" x2="270" y2="150" 
              style="transform: translate(-180px, -160px) rotate(-25deg);" />
        <!-- Right diagonal part: enters from bottom-right (200px, 150px) -->
        <line id="w1-a-r" class="char-part" x1="270" y1="150" x2="340" y2="360"
              style="transform: translate(160px, 180px) rotate(30deg);" />
        <!-- Triangle inner cut / accent: enters from top center -->
        <polygon id="w1-a-cut" class="char-part red-accent filled" points="270,170 295,240 245,240"
                 style="transform: translate(0, -220px) scale(0.4);" />

        <!-- Letter 2: 'E' (Formed by vertical spine + 3 horizontal bars) -->
        <!-- Vertical spine: enters from left (-240px, 0) -->
        <line id="w1-e-v" class="char-part" x1="420" y1="150" x2="420" y2="360"
              style="transform: translate(-240px, 0);" />
        <!-- Top bar: enters from top-right (100px, -150px) -->
        <line id="w1-e-t" class="char-part" x1="420" y1="150" x2="520" y2="150"
              style="transform: translate(120px, -140px);" />
        <!-- Middle bar: enters from right (200px, 0) -->
        <line id="w1-e-m" class="char-part" x1="420" y1="250" x2="500" y2="250"
              style="transform: translate(220px, 0);" />
        <!-- Bottom bar: enters from bottom-left (-100px, 150px) -->
        <line id="w1-e-b" class="char-part" x1="420" y1="360" x2="520" y2="360"
              style="transform: translate(-120px, 160px);" />

        <!-- Letter 3: 'V' (Formed by 2 converging diagonal strokes) -->
        <!-- Left diagonal: enters from bottom-left (-160px, 180px) -->
        <line id="w1-v-l" class="char-part red-accent" x1="600" y1="150" x2="665" y2="360"
              style="transform: translate(-170px, 190px) rotate(-15deg);" />
        <!-- Right diagonal: enters from top-right (170px, -180px) -->
        <line id="w1-v-r" class="char-part red-accent" x1="730" y1="150" x2="665" y2="360"
              style="transform: translate(180px, -170px) rotate(20deg);" />

        <!-- Letter 4: 'Y' (Formed by top-left diagonal, top-right diagonal, and stem) -->
        <!-- Stem: enters from bottom (0, 200px) -->
        <line id="w1-y-stem" class="char-part" x1="875" y1="260" x2="875" y2="360"
              style="transform: translate(0, 220px);" />
        <!-- Left arm: enters from top-left (-140px, -140px) -->
        <line id="w1-y-l" class="char-part" x1="810" y1="150" x2="875" y2="260"
              style="transform: translate(-150px, -150px) rotate(-35deg);" />
        <!-- Right arm: enters from top-right (140px, -140px) -->
        <line id="w1-y-r" class="char-part" x1="940" y1="150" x2="875" y2="260"
              style="transform: translate(150px, -150px) rotate(35deg);" />
      </g>
    </svg>
  </div>

  <!-- STAGE 2: FINAL VALORANT V + 100% PURE WHITE FULL NAME -->
  <div id="final-container">
    <!-- Valorant V Blade Assembly -->
    <div class="v-logo-box">
      <div class="v-blade v-blade-l" id="blade-l"></div>
      <div class="v-blade v-blade-r" id="blade-r"></div>
      <div class="v-cyan-slit" id="cyan-slit"></div>
    </div>

    <!-- Valorant Wordmark -->
    <div class="valorant-subtext" id="val-word">VALORANT</div>

    <!-- Full Name in 100% PURE WHITE & VALORANT FONT -->
    <div id="full-name-reveal">
      <div class="name-full-text" id="name-full">FAHIM AHAMMAD TANVIR</div>
      <div class="title-sub" id="title-sub">SOFTWARE ENGINEER // SUST // FULL-STACK</div>
    </div>
  </div>

  <!-- Navigation Buttons -->
  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">REPLAY</button>
    <button class="btn" id="enter-btn">ENTER PORTFOLIO &rsaquo;</button>
  </div>

  <script>
    const audio = document.getElementById('reveal-audio');
    const splash = document.getElementById('start-splash');
    const kineticStage = document.getElementById('kinetic-stage');
    const finalContainer = document.getElementById('final-container');
    const bladeL = document.getElementById('blade-l');
    const bladeR = document.getElementById('blade-r');
    const cyanSlit = document.getElementById('cyan-slit');
    const valWord = document.getElementById('val-word');
    const nameFull = document.getElementById('name-full');
    const titleSub = document.getElementById('title-sub');
    const navBar = document.getElementById('nav-bar');
    const enterBtn = document.getElementById('enter-btn');
    const replayBtn = document.getElementById('replay-btn');

    // All letter parts
    const parts = [
      document.getElementById('w1-a-l'),
      document.getElementById('w1-a-r'),
      document.getElementById('w1-a-cut'),
      document.getElementById('w1-e-v'),
      document.getElementById('w1-e-t'),
      document.getElementById('w1-e-m'),
      document.getElementById('w1-e-b'),
      document.getElementById('w1-v-l'),
      document.getElementById('w1-v-r'),
      document.getElementById('w1-y-stem'),
      document.getElementById('w1-y-l'),
      document.getElementById('w1-y-r')
    ];

    const wait = ms => new Promise(res => setTimeout(res, ms));

    // 1-Click Audio Unlock
    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      audio.currentTime = 0;
      audio.play().catch(e => console.log('Audio unlock:', e));
      startKineticAssembly();
    });

    async function startKineticAssembly() {
      // Reset all states
      kineticStage.style.display = 'flex';
      kineticStage.classList.remove('glitch-active');
      finalContainer.style.display = 'none';
      bladeL.classList.remove('assembled');
      bladeR.classList.remove('assembled');
      cyanSlit.style.opacity = '0';
      valWord.classList.remove('show');
      nameFull.classList.remove('show');
      titleSub.classList.remove('show');
      navBar.classList.remove('show');

      parts.forEach(p => p.classList.remove('locked'));

      /* ============================================================
         PHASE 1: STAGGERED TRANSIT OF PARTS TO ASSEMBLE LETTERS
         Letters A, E, V, Y form from individual geometric lines
         ============================================================ */
      await wait(200);

      // 1. Transit Letter 'A' parts
      document.getElementById('w1-a-l').classList.add('locked');
      await wait(120);
      document.getElementById('w1-a-r').classList.add('locked');
      await wait(100);
      document.getElementById('w1-a-cut').classList.add('locked');

      await wait(180);

      // 2. Transit Letter 'E' parts
      document.getElementById('w1-e-v').classList.add('locked');
      await wait(90);
      document.getElementById('w1-e-t').classList.add('locked');
      document.getElementById('w1-e-m').classList.add('locked');
      document.getElementById('w1-e-b').classList.add('locked');

      await wait(180);

      // 3. Transit Letter 'V' parts (Red Accent)
      document.getElementById('w1-v-l').classList.add('locked');
      await wait(110);
      document.getElementById('w1-v-r').classList.add('locked');

      await wait(180);

      // 4. Transit Letter 'Y' parts
      document.getElementById('w1-y-stem').classList.add('locked');
      await wait(90);
      document.getElementById('w1-y-l').classList.add('locked');
      document.getElementById('w1-y-r').classList.add('locked');

      // Now the word "AEVY" / geometric typography is fully formed!
      await wait(800);

      /* ============================================================
         PHASE 2: FRACTAL GLITCH & DISPLACEMENT SLICE (Frame 9 in Short)
         ============================================================ */
      kineticStage.classList.add('glitch-active');
      await wait(75);
      kineticStage.classList.remove('glitch-active');
      await wait(45);
      kineticStage.classList.add('glitch-active');
      await wait(60);
      kineticStage.classList.remove('glitch-active');

      await wait(300);

      // Hard cut / snap collapse of the assembled stage
      kineticStage.style.display = 'none';

      /* ============================================================
         PHASE 3: VALORANT V REVEAL (Blades Transit & Converge)
         ============================================================ */
      finalContainer.style.display = 'flex';
      await wait(40);

      // The two V blades transit from diagonal directions and assemble
      bladeL.classList.add('assembled');
      bladeR.classList.add('assembled');
      await wait(220);

      // Cyan slit flash
      cyanSlit.style.opacity = '1';
      await wait(90);
      cyanSlit.style.opacity = '0';

      // VALORANT Wordmark reveal
      valWord.classList.add('show');
      await wait(450);

      /* ============================================================
         PHASE 4: FULL NAME REVEAL - 100% PURE WHITE & VALORANT FONT
         ============================================================ */
      nameFull.classList.add('show');
      titleSub.classList.add('show');
      await wait(600);

      navBar.classList.add('show');
    }

    // Portfolio Navigation
    function enterSite() {
      document.body.style.transition = 'opacity 0.4s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 400);
    }

    enterBtn.addEventListener('click', enterSite);
    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startKineticAssembly();
    });

    document.addEventListener('keydown', (e) => {
      if (navBar.classList.contains('show')) enterSite();
    });
  </script>
</body>
</html>
