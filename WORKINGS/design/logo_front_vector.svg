<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Rich Crimson Red Gradient with subtle metallic lighting -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF2638" />
      <stop offset="50%" stop-color="#9E1B2B" />
      <stop offset="100%" stop-color="#78101E" />
    </linearGradient>

    <!-- Top Roof Bevel Highlight -->
    <linearGradient id="roofHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9384C" />
      <stop offset="100%" stop-color="#8A1726" />
    </linearGradient>

    <!-- Neon Mint-Cyan Glow -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55FFD2" />
      <stop offset="100%" stop-color="#00E599" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Tactical Canvas Background -->
  <rect width="600" height="600" fill="#0C0E12" rx="32" />

  <!-- Subtle Cyber-Grid HUD Overlay -->
  <g opacity="0.12" stroke="#00E599" stroke-width="1">
    <line x1="120" y1="80" x2="480" y2="80" stroke-dasharray="6,6" />
    <line x1="120" y1="460" x2="480" y2="460" stroke-dasharray="6,6" />
    <line x1="140" y1="100" x2="140" y2="440" stroke-dasharray="4,8" />
    <line x1="460" y1="100" x2="460" y2="440" stroke-dasharray="4,8" />
    <!-- Reticles -->
    <path d="M 115 80 L 125 80 M 120 75 L 120 85" stroke="#FF4655" stroke-width="2" />
    <path d="M 475 80 L 485 80 M 480 75 L 480 85" stroke="#FF4655" stroke-width="2" />
    <path d="M 115 460 L 125 460 M 120 455 L 120 465" stroke="#FF4655" stroke-width="2" />
    <path d="M 475 460 L 485 460 M 480 455 L 480 465" stroke="#FF4655" stroke-width="2" />
  </g>

  <!-- MAIN EMBLEM GROUP -->
  <g filter="url(#dropShadow)">
    <!-- 1. Top Beveled Bar & Left Crest -->
    <polygon points="152,172 440,172 414,214 260,214 200,172" fill="url(#roofHighlight)" />
    
    <!-- 2. Main F Body (Slanted Left Spine with sharp beveled tip) -->
    <!-- Top left wing: (152,172) -> (200,224) -> (200,310) -> (236,368) -> (230,436) -> (288,380) ... -->
    <polygon points="152,172 200,224 230,224 230,436 288,380 288,322 396,322 356,368 288,368 288,272 414,214 440,172 260,172" fill="url(#redGradient)" />
    
    <!-- Chamfer & Facet bevel lines for 3D armor plate look -->
    <!-- Inner spine core shadow -->
    <polygon points="200,224 230,224 230,436 288,380 288,322 396,322 380,338 274,338 274,380 230,422" fill="#630D19" opacity="0.6" />
    
    <!-- Diagonal Slice Groove Highlight -->
    <line x1="202" y1="210" x2="276" y2="284" stroke="#0C0E12" stroke-width="9" stroke-linecap="round" />
    <line x1="202" y1="210" x2="276" y2="284" stroke="#FF4655" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />

    <!-- 3. Floating Neon Mint-Cyan Accent Notch (Top Right Wing) -->
    <polygon points="412,176 468,176 432,216 424,204 444,188 418,188" fill="url(#cyanGradient)" filter="url(#cyanGlow)" />

    <!-- 4. Floating Neon Mint-Cyan Accent Blade (Mid Left Flank) -->
    <polygon points="196,224 218,224 220,296 206,324 196,306 206,290" fill="url(#cyanGradient)" filter="url(#cyanGlow)" />
  </g>

  <!-- Typography Below Emblem -->
  <text x="300" y="495" font-family="'Share Tech Mono', monospace" font-size="28" font-weight="bold" fill="#EAE0D5" letter-spacing="6" text-anchor="middle">
    // SYS_ID: FAT-23
  </text>
  
  <text x="300" y="525" font-family="'Share Tech Mono', monospace" font-size="11" fill="#00E599" letter-spacing="4" opacity="0.75" text-anchor="middle">
    SUST // SOFTWARE ENGINEER // 2026
  </text>
</svg>
