<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE 1 PROTOTYPE // F & A MACRO GEOMETRIC BUILD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('valorant_font/Valorant Font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
      --val-cyan: #00f5d4;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Valorant', sans-serif;
      position: relative;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.16) 3px,
        rgba(0, 0, 0, 0.16) 4px
      );
      pointer-events: none;
      z-index: 950;
    }

    /* 1-Click Audio Unlock Gate */
    #start-splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #start-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255, 70, 85, 0.4);
      padding: 26px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 70, 85, 0.04);
      position: relative;
    }
    .splash-box::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red);
      border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: '';
      position: absolute;
      bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red);
      border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-size: 30px;
      letter-spacing: 0.25em;
      color: var(--val-white);
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.45em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* Global Stage */
    #stage-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--val-red);
      z-index: 50;
    }

    /* Fixed Clean Micro-Coordinates (As verified in Frame 70) */
    .micro-data {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.35em;
      color: var(--val-dark);
      opacity: 0.65;
      pointer-events: none;
      z-index: 80;
    }
    .data-tl { top: 32px; left: 40px; }
    .data-tr { top: 32px; right: 40px; }
    .data-br { bottom: 32px; right: 40px; }

    /* 45-degree Hairline Construction Axis */
    .axis-hairline {
      position: absolute;
      width: 200vw;
      height: 1px;
      background: rgba(15, 25, 35, 0.25);
      top: 15%;
      left: -50%;
      transform: rotate(45deg);
      pointer-events: none;
      z-index: 40;
    }

    /* Vertical Thin Razor Axis */
    .axis-vertical {
      position: absolute;
      width: 1px;
      height: 100vh;
      background: rgba(15, 25, 35, 0.2);
      left: 58%;
      top: 0;
      pointer-events: none;
      z-index: 40;
    }

    /* Small Floating Solid Squares */
    .micro-sq {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--val-dark);
      z-index: 70;
    }

    /* ============================================================
       BEAT 1: THE "F" ANCHOR & TOP HORIZONTAL BEAM (Frames 35 - 68)
       Exact Frame 36, 46, 54, 62: Left dark block with top blade,
       plus lower base slab sliding upward into position!
       ============================================================ */
    #beat-1 {
      position: absolute;
      inset: 0;
      display: none;
    }

    /* The Main Left Vertical Spine of 'F' */
    .f-spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 25%;
      background: var(--val-dark);
      clip-path: polygon(0 0, 100% 0, 100% 85%, 85% 100%, 0 100%);
    }

    /* The Top Massive Horizontal Bar of 'F' */
    .f-top-bar {
      position: absolute;
      top: 0;
      left: 25%;
      height: 20%;
      width: 45%;
      background: var(--val-dark);
      transform-origin: left top;
    }

    /* The Lower Crossbar Slab that SLIDES IN from bottom (The exact micro-motion!) */
    .f-lower-slab {
      position: absolute;
      left: 42%;
      width: 24%;
      height: 52%;
      background: var(--val-dark);
      will-change: transform;
      animation: slabSlideUp 0.65s cubic-bezier(0.12, 0.8, 0.2, 1) forwards;
    }
    @keyframes slabSlideUp {
      0% {
        bottom: -55%;
      }
      100% {
        bottom: 0;
      }
    }

    /* Right Edge Silhouette Cutout */
    .beat1-right-fill {
      position: absolute;
      right: 0;
      top: 32%;
      bottom: 0;
      width: 38%;
      background: var(--val-dark);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    /* ============================================================
       BEAT 2: HARD SNAP CUT TO "A" GEOMETRIC DIAGONAL (Frames 69 - 83)
       Exact Frame 70, 72, 78: Big 45-degree diagonal leg on left,
       square cutouts in center, and vertical bar on right!
       ============================================================ */
    #beat-2 {
      position: absolute;
      inset: 0;
      display: none;
    }

    /* Left 45-degree Massive Diagonal Leg of 'A' */
    .a-diagonal-leg {
      position: absolute;
      left: -2%;
      bottom: -15%;
      width: 38%;
      height: 125%;
      background: var(--val-dark);
      clip-path: polygon(0% 100%, 36% 100%, 96% 28%, 96% 24%, 72% 24%, 0% 86%);
      animation: legMicroDrift 0.35s cubic-bezier(0.1, 0.7, 0.2, 1) forwards;
    }
    @keyframes legMicroDrift {
      0% { transform: translate(25px, -12px); }
      100% { transform: translate(0, 0); }
    }

    /* Center Stacking Geometry: The Two Square Cutouts of 'A' (Frames 70, 78) */
    .a-center-square-top {
      position: absolute;
      left: 46%;
      top: 31%;
      width: 125px;
      height: 125px;
      background: var(--val-dark);
      border-radius: 6px 18px 6px 6px;
    }
    .a-center-square-bot {
      position: absolute;
      left: 46%;
      bottom: 12%;
      width: 125px;
      height: 125px;
      background: var(--val-dark);
    }

    /* Right Pillar (Vertical Bar) */
    .a-right-pillar {
      position: absolute;
      left: 66%;
      bottom: 12%;
      width: 120px;
      height: 48%;
      background: var(--val-dark);
    }

    /* Far Right Diagonal Corner Blade */
    .a-far-right-blade {
      position: absolute;
      right: 0;
      top: 0;
      width: 22%;
      height: 100%;
      background: var(--val-dark);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%);
    }

    /* Nav / Controls */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show {
      opacity: 1;
    }
    .btn {
      background: rgba(15, 25, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-dark);
      border-color: var(--val-white);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>

  <!-- Audio Element -->
  <audio id="reveal-audio" preload="auto">
    <source src="reveal_audio.webm" type="audio/webm" />
  </audio>

  <!-- 1-Click Gate -->
  <div id="start-splash">
    <div class="splash-box">
      <div class="splash-title">SCENE 1 // F & A</div>
      <div class="splash-sub">CLICK TO TEST EXACT 2-BEAT GEOMETRIC ASSEMBLY</div>
    </div>
  </div>

  <!-- STAGE -->
  <div id="stage-container">

    <!-- Thin Clean Technical Lines (As in Frames 35-83) -->
    <div class="axis-hairline"></div>
    <div class="axis-vertical"></div>

    <div class="micro-data data-tl">01 // PROTOCOL // F_BUILD</div>
    <div class="micro-data data-tr">COORD // 35.48.36.N // 139.45.03.E</div>
    <div class="micro-data data-br">SYS // VLRNT_CORE</div>

    <div class="micro-sq" style="top: 24%; left: 45%;"></div>
    <div class="micro-sq" style="top: 42%; left: 44%;"></div>
    <div class="micro-sq" style="bottom: 28%; left: 38%;"></div>

    <!-- BEAT 1: "F" GEOMETRIC BUILD (Frames 35-68) -->
    <div id="beat-1">
      <div class="f-spine"></div>
      <div class="f-top-bar"></div>
      <div class="f-lower-slab" id="f-slab"></div>
      <div class="beat1-right-fill"></div>
    </div>

    <!-- BEAT 2: "A" GEOMETRIC SNAP CUT (Frames 69-83) -->
    <div id="beat-2">
      <div class="a-diagonal-leg"></div>
      <div class="a-center-square-top"></div>
      <div class="a-center-square-bot"></div>
      <div class="a-right-pillar"></div>
      <div class="a-far-right-blade"></div>
    </div>

  </div>

  <!-- Replay Button -->
  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">REPLAY BEAT 1 & 2</button>
  </div>

  <script>
    const splash = document.getElementById('start-splash');
    const audio = document.getElementById('reveal-audio');
    const beat1 = document.getElementById('beat-1');
    const beat2 = document.getElementById('beat-2');
    const fSlab = document.getElementById('f-slab');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      audio.currentTime = 0.55; // Start right at Scene 1 timestamp
      audio.play().catch(e => console.log('Audio error:', e));
      runScene1ExactBeats();
    });

    async function runScene1ExactBeats() {
      beat1.style.display = 'none';
      beat2.style.display = 'none';
      navBar.classList.remove('show');

      // Reset slab animation
      fSlab.style.animation = 'none';
      fSlab.offsetHeight; // trigger reflow
      fSlab.style.animation = 'slabSlideUp 0.65s cubic-bezier(0.12, 0.8, 0.2, 1) forwards';

      /* ============================================================
         BEAT 1: Frames 35 to 68 (~550ms)
         F spine + Top beam + Lower slab slides up from bottom!
         ============================================================ */
      beat1.style.display = 'block';
      await wait(580);
      beat1.style.display = 'none';

      /* ============================================================
         BEAT 2: Frames 69 to 83 (~250ms)
         Hard Snap Cut! The 45-degree 'A' diagonal leg + Center blocks + Pillar
         ============================================================ */
      beat2.style.display = 'block';
      await wait(320);

      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      runScene1ExactBeats();
    });
  </script>
</body>
</html>
