<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE V16 // TRUE GEOMETRIC BUILD ➔ FAHIM HIGHWAY (FRAMES 265 - 282)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 900;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255,70,85,0.4);
      padding: 28px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: rgba(255,70,85,0.04);
      position: relative;
    }
    .splash-box::before {
      content: ''; position: absolute; top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red); border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: ''; position: absolute; bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red); border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-family: 'Valorant', sans-serif;
      font-size: 26px;
      letter-spacing: 0.22em;
      color: var(--val-white);
      text-align: center;
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }

    /* ========================================================
       MASTER STAGE: FRAMES 265 - 282
       ======================================================== */
    #stage {
      position: fixed;
      inset: 0;
      background: var(--val-red);
      overflow: hidden;
      display: none;
      z-index: 50;
    }

    /* 45-degree Thin Diagonal Hairline across Stage */
    .hairline-axis {
      position: absolute;
      width: 180vw;
      height: 1.5px;
      background: rgba(15, 25, 35, 0.42);
      top: -10%;
      left: 10%;
      transform: rotate(45deg);
      transform-origin: top left;
      pointer-events: none;
      z-index: 60;
    }

    /* Left Edge Dark Chevron Pip (x=38px, y=245px) */
    .left-chevron-pip {
      position: absolute;
      top: 48%;
      left: 38px;
      width: 16px;
      height: 12px;
      background: var(--val-dark);
      clip-path: polygon(0% 15%, 65% 15%, 100% 50%, 65% 85%, 0% 85%);
      z-index: 80;
    }

    /* Center Stationary Dash Stems (I-bars at x≈360px & x≈660px) */
    .center-stem-left {
      position: absolute;
      top: 46%;
      left: 28%;
      width: 16px;
      height: 44px;
      background: var(--val-dark);
      z-index: 80;
    }
    .center-stem-right {
      position: absolute;
      top: 49%;
      left: 51%;
      width: 16px;
      height: 44px;
      background: var(--val-dark);
      z-index: 80;
    }

    /* ========================================================
       STAGE 1: EXACT GEOMETRIC PIECE BUILD (Frames 265 - 270)
       1. Frame 265: Initial two central anchor bars
       2. Frame 266: Massive Pill with inner cutout hole on Lane 2 & Half-Pill on Lane 3
       3. Frame 267-268: Cutout shrinks into 'O', wedges shoot down to form 'R' and 'A'
       ======================================================== */

    /* The Initial Two Center Anchor Bars (Frame 265) */
    .initial-anchor-left {
      position: absolute;
      top: 46%;
      left: 17.5%;
      width: 128px;
      height: 58px;
      background: var(--val-dark);
      z-index: 75;
      animation: anchorBarLeftAnim 0.32s cubic-bezier(0.12, 0.9, 0.2, 1) forwards;
    }
    @keyframes anchorBarLeftAnim {
      0%   { opacity: 1; transform: scaleX(1); }
      50%  { opacity: 1; transform: scaleX(0.7) translateX(-20px); }
      100% { opacity: 0; transform: scaleX(0.1) translateX(-60px); }
    }

    .initial-anchor-right {
      position: absolute;
      top: 52%;
      left: 54%;
      width: 128px;
      height: 58px;
      background: var(--val-dark);
      z-index: 75;
      animation: anchorBarRightAnim 0.32s cubic-bezier(0.12, 0.9, 0.2, 1) forwards;
    }
    @keyframes anchorBarRightAnim {
      0%   { opacity: 1; transform: scaleX(1); }
      50%  { opacity: 1; transform: scaleX(0.7) translateX(20px); }
      100% { opacity: 0; transform: scaleX(0.1) translateX(60px); }
    }

    /* 
       THE GROWING NUCLEUS CAPSULES & WEDGES (Frames 266 ➔ 270)
       These shapes appear at 0.08s and morph in 0.4s directly into the text!
    */
    .morph-capsule-right {
      position: absolute;
      top: 24%;
      left: 65%;
      width: 440px;
      height: 128px;
      background: var(--val-dark);
      border-radius: 64px;
      z-index: 76;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: capsuleRightAnim 0.45s cubic-bezier(0.12, 0.95, 0.2, 1) 0.06s forwards;
    }
    .morph-capsule-right::after {
      content: '';
      width: 120px;
      height: 72px;
      background: var(--val-red);
      border-radius: 36px;
      animation: capsuleHoleAnim 0.45s cubic-bezier(0.12, 0.95, 0.2, 1) 0.06s forwards;
    }
    @keyframes capsuleRightAnim {
      0%   { opacity: 0; transform: scaleX(0.2) translateX(30vw); width: 440px; }
      20%  { opacity: 1; width: 440px; }
      60%  { opacity: 1; width: 200px; transform: scaleX(1) translateX(12vw); }
      100% { opacity: 0; width: 140px; transform: scaleX(0.8) translateX(-5vw); }
    }
    @keyframes capsuleHoleAnim {
      0%   { opacity: 0; transform: scale(0.2); }
      30%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.9); }
    }

    .morph-capsule-left {
      position: absolute;
      top: 56%;
      left: -20px;
      width: 220px;
      height: 128px;
      background: var(--val-dark);
      border-radius: 0 64px 64px 0;
      z-index: 76;
      animation: capsuleLeftAnim 0.45s cubic-bezier(0.12, 0.95, 0.2, 1) 0.06s forwards;
    }
    @keyframes capsuleLeftAnim {
      0%   { opacity: 0; transform: scaleX(0.3) translateX(-20vw); width: 220px; }
      20%  { opacity: 1; width: 220px; }
      60%  { opacity: 1; width: 120px; transform: scaleX(1) translateX(5vw); }
      100% { opacity: 0; width: 60px; transform: scaleX(0.6) translateX(12vw); }
    }

    /* Morphing Diagonal Letter Wedges (Frames 267-270) */
    .morph-wedge-r {
      position: absolute;
      top: 32%;
      left: 56%;
      width: 44px;
      height: 86px;
      background: var(--val-dark);
      clip-path: polygon(0% 0%, 50% 0%, 100% 100%, 50% 100%);
      z-index: 76;
      animation: wedgeAnim 0.4s cubic-bezier(0.15, 0.9, 0.2, 1) 0.1s forwards;
    }
    .morph-wedge-l {
      position: absolute;
      top: 58%;
      left: 21%;
      width: 44px;
      height: 86px;
      background: var(--val-dark);
      clip-path: polygon(50% 0%, 100% 0%, 50% 100%, 0% 100%);
      z-index: 76;
      animation: wedgeAnim 0.4s cubic-bezier(0.15, 0.9, 0.2, 1) 0.1s forwards;
    }
    @keyframes wedgeAnim {
      0%   { opacity: 0; transform: scale(0.2); }
      30%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    /* ========================================================
       STAGE 2: THE 4-LANE PROGRESSIVE REVEAL (Frames 270 ➔ 282)
       1. Primary Core (Lane 2 & Lane 3) appears FIRST at ~0.42s
       2. Outer Highway (Lane 1 Ceiling & Lane 4 Floor) appears sequentially at ~0.55s!
       ======================================================== */

    /* ----------------------------------------------------
       LANE 2 (Upper-Middle Primary): 180° INVERTED FAHIM
       Appears out of the right capsule morph at 0.42s and slides LEFT
       ---------------------------------------------------- */
    .lane-2-container {
      position: absolute;
      top: 20%;
      left: 0;
      right: 0;
      height: 26%;
      overflow: hidden;
      z-index: 70;
      opacity: 0;
      animation: lane2Reveal 0.95s cubic-bezier(0.12, 0.96, 0.24, 1) 0.42s forwards;
    }
    .lane-2-content {
      position: absolute;
      bottom: -2vh;
      left: 0;
      display: flex;
      gap: 5vw;
      font-family: 'Valorant', sans-serif;
      font-size: 28vh;
      line-height: 1;
      color: var(--val-dark);
      transform: rotate(180deg);
      transform-origin: center center;
      white-space: nowrap;
      will-change: transform;
      animation: lane2GlideLeft 0.95s cubic-bezier(0.12, 0.96, 0.24, 1) 0.42s forwards;
    }
    @keyframes lane2Reveal {
      0%   { opacity: 0; }
      20%  { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes lane2GlideLeft {
      0%   { transform: rotate(180deg) translateX(-35vw); }
      100% { transform: rotate(180deg) translateX(8vw); }
    }

    /* ----------------------------------------------------
       LANE 3 (Lower-Middle Primary): UPRIGHT FAHIM
       Appears out of the left capsule morph at 0.42s and slides RIGHT
       ---------------------------------------------------- */
    .lane-3-container {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 28%;
      overflow: hidden;
      z-index: 70;
      opacity: 0;
      animation: lane3Reveal 0.95s cubic-bezier(0.12, 0.96, 0.24, 1) 0.42s forwards;
    }
    .lane-3-content {
      position: absolute;
      top: -2vh;
      left: 0;
      display: flex;
      gap: 5vw;
      font-family: 'Valorant', sans-serif;
      font-size: 28vh;
      line-height: 1;
      color: var(--val-dark);
      white-space: nowrap;
      will-change: transform;
      animation: lane3GlideRight 0.95s cubic-bezier(0.12, 0.96, 0.24, 1) 0.42s forwards;
    }
    @keyframes lane3Reveal {
      0%   { opacity: 0; }
      20%  { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes lane3GlideRight {
      0%   { transform: translateX(-22vw); }
      100% { transform: translateX(12vw); }
    }

    /* ----------------------------------------------------
       LANE 1 (Top Edge Ceiling): Upright FAHIM, Slides RIGHT
       Sequential appearance at 0.55s! Sliced 75% at ceiling.
       ---------------------------------------------------- */
    .lane-1-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 12%;
      overflow: hidden;
      z-index: 70;
      opacity: 0;
      animation: outerLaneReveal 0.85s cubic-bezier(0.12, 0.96, 0.24, 1) 0.55s forwards;
    }
    .lane-1-content {
      position: absolute;
      bottom: -15vh;
      left: 0;
      display: flex;
      gap: 4vw;
      font-family: 'Valorant', sans-serif;
      font-size: 24vh;
      line-height: 1;
      color: var(--val-dark);
      white-space: nowrap;
      will-change: transform;
      animation: lane1GlideRight 0.85s cubic-bezier(0.12, 0.96, 0.24, 1) 0.55s forwards;
    }
    @keyframes lane1GlideRight {
      0%   { transform: translateX(-18vw); }
      100% { transform: translateX(6vw); }
    }

    /* ----------------------------------------------------
       LANE 4 (Bottom Edge Floor): 180° INVERTED FAHIM, Slides LEFT
       Sequential appearance at 0.55s! Sliced 75% at floor.
       ---------------------------------------------------- */
    .lane-4-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12%;
      overflow: hidden;
      z-index: 70;
      opacity: 0;
      animation: outerLaneReveal 0.85s cubic-bezier(0.12, 0.96, 0.24, 1) 0.55s forwards;
    }
    .lane-4-content {
      position: absolute;
      top: -15vh;
      left: 0;
      display: flex;
      gap: 4vw;
      font-family: 'Valorant', sans-serif;
      font-size: 24vh;
      line-height: 1;
      color: var(--val-dark);
      transform: rotate(180deg);
      transform-origin: center center;
      white-space: nowrap;
      will-change: transform;
      animation: lane4GlideLeft 0.85s cubic-bezier(0.12, 0.96, 0.24, 1) 0.55s forwards;
    }
    @keyframes outerLaneReveal {
      0%   { opacity: 0; }
      30%  { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes lane4GlideLeft {
      0%   { transform: rotate(180deg) translateX(-30vw); }
      100% { transform: rotate(180deg) translateX(10vw); }
    }

    /* ========================================================
       MICRO-DETAILS & HUD (Frames 265 - 282)
       ======================================================== */
    .hud-label {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: rgba(15, 25, 35, 0.75);
      z-index: 85;
    }

    .micro-dash {
      position: absolute;
      height: 3px;
      background: var(--val-dark);
      z-index: 85;
    }

    .micro-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--val-dark);
      z-index: 85;
    }

    /* Replay Button */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show { opacity: 1; }
    .btn {
      background: rgba(15,25,35,0.85);
      border: 1px solid rgba(255,255,255,0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.25em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-dark);
      border-color: var(--val-white);
      color: var(--val-red);
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <!-- Background Audio -->
  <video id="reveal-media" style="display:none;" preload="auto">
    <source src="../Valorant logo reveal animation _Project A_ - Trim.mp4" type="video/mp4" />
    <source src="../reveal_audio.webm" type="audio/webm" />
  </video>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V16 // FAHIM GEOMETRIC REVEAL</div>
      <div class="splash-sub">CLICK TO PLAY FRAMES 265 - 282 TRUE PROGRESSION</div>
    </div>
  </div>

  <!-- Master Stage -->
  <div id="stage">
    <div class="hairline-axis"></div>

    <!-- Center Static Elements from Frames 265-282 -->
    <div class="left-chevron-pip"></div>
    <div class="center-stem-left"></div>
    <div class="center-stem-right"></div>

    <!-- ========================================================
         PHASE 1: THE ACCURATE GEOMETRIC SHAPES (0.0s - 0.42s)
         ======================================================== -->
    <!-- Initial Center Anchor Bars (Frame 265) -->
    <div class="initial-anchor-left"></div>
    <div class="initial-anchor-right"></div>

    <!-- Morphing Rounded Pill Capsules & Wedges (Frames 266-270) -->
    <div class="morph-capsule-right"></div>
    <div class="morph-capsule-left"></div>
    <div class="morph-wedge-r"></div>
    <div class="morph-wedge-l"></div>

    <!-- ========================================================
         PHASE 2: PRIMARY CORE WORDS EMERGE (0.42s - 1.4s)
         ======================================================== -->
    <!-- LANE 2: 180° Inverted FAHIM, Slides LEFT -->
    <div class="lane-2-container" id="lane-2">
      <div class="lane-2-content">
        <span>FAHIM</span>
        <span>FAHIM</span>
      </div>
    </div>

    <!-- LANE 3: Upright FAHIM, Slides RIGHT -->
    <div class="lane-3-container" id="lane-3">
      <div class="lane-3-content">
        <span>FAHIM</span>
        <span>FAHIM</span>
      </div>
    </div>

    <!-- ========================================================
         PHASE 3: OUTER LANES EMERGE SEQUENTIALLY (0.55s - 1.4s)
         ======================================================== -->
    <!-- LANE 1 (Top Edge Ceiling): Upright FAHIM, Slides RIGHT -->
    <div class="lane-1-container" id="lane-1">
      <div class="lane-1-content">
        <span>FAHIM</span>
        <span>FAHIM</span>
      </div>
    </div>

    <!-- LANE 4 (Bottom Edge Floor): 180° Inverted FAHIM, Slides LEFT -->
    <div class="lane-4-container" id="lane-4">
      <div class="lane-4-content">
        <span>FAHIM</span>
        <span>FAHIM</span>
      </div>
    </div>

    <!-- Technical HUD Details (from Frames 265-282) -->
    <div class="micro-dash" style="top: 24%; left: 5%; width: 56px;"></div>
    <div class="micro-dash" style="top: 24%; right: 9%; width: 56px;"></div>
    <div class="micro-dash" style="top: 70%; right: 9%; width: 64px;"></div>
    
    <div class="micro-dot" style="top: 36%; left: 16%;"></div>
    <div class="micro-dot" style="top: 36%; left: 32%;"></div>
    <div class="micro-dot" style="top: 66%; right: 16%;"></div>
    <div class="micro-dot" style="top: 74%; right: 16%;"></div>

    <div class="hud-label" style="top: 36%; left: 27%;">VLRNT // SWE_23</div>
    <div class="hud-label" style="top: 90%; left: 28%;">PRTCL // FAHIM</div>
    <div class="hud-label" style="top: 10%; right: 10%;">BIND // HAVEN</div>
    <div class="hud-label" style="top: 90%; right: 10%;">SUST // SWE</div>
  </div>

  <!-- Replay Button -->
  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">↺ REPLAY "FAHIM" BUILD</button>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const media = document.getElementById('reveal-media');
    const stage = document.getElementById('stage');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    function startAudio() {
      try {
        media.currentTime = 10.0;
        const p = media.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      playGeometricBuild();
    });

    async function playGeometricBuild() {
      navBar.classList.remove('show');
      stage.style.display = 'none';

      // Reset all animations inside stage
      stage.querySelectorAll('*').forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });

      startAudio();
      stage.style.display = 'block';

      // Complete progression duration: 1.45s
      await wait(1450);

      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playGeometricBuild();
    });
  </script>
</body>
</html>
