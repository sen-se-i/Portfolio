<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE V11 // JOINED V4 + V9 + V10 SEQUENCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 900;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255,70,85,0.4);
      padding: 28px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: rgba(255,70,85,0.04);
      position: relative;
    }
    .splash-box::before {
      content: ''; position: absolute; top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red); border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: ''; position: absolute; bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red); border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-family: 'Valorant', sans-serif;
      font-size: 26px;
      letter-spacing: 0.22em;
      color: var(--val-white);
      text-align: center;
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }

    /* Top HUD / Scene Tracker */
    .scene-hud {
      position: fixed;
      top: 20px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 800;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .scene-hud.show { opacity: 1; }
    .hud-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.25em;
      padding: 5px 12px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(8,12,16,0.65);
      color: rgba(255,255,255,0.6);
      transition: all 0.25s;
    }
    .hud-badge.active {
      border-color: var(--val-red);
      background: rgba(255,70,85,0.25);
      color: var(--val-white);
    }

    /* Master Stage */
    #master-stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 50;
    }

    .scene-container {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
    }

    /* ========================================================
       1. SCENE V4: "F" WITH DETAILED MOVING MICRO-SHAPES
       ======================================================== */
    #scene-v4 {
      background: var(--val-dark);
    }

    /* V4 Phase 1: Frames 1 - 31 (Dark Setup + Floating Elements) */
    #v4-phase-1 {
      position: absolute;
      inset: 0;
      background: var(--val-dark);
    }
    .p1-left-wall {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 20%;
      background: var(--val-red);
    }
    .p1-right-wedge {
      position: absolute;
      right: 0; bottom: 0;
      width: 65%; height: 90%;
      background: var(--val-red);
      clip-path: polygon(42% 0, 100% 0, 100% 100%, 0 100%);
      will-change: transform;
      animation: wedgeSlideLeft 0.52s linear forwards;
    }
    @keyframes wedgeSlideLeft {
      0% { transform: translateX(45px); }
      100% { transform: translateX(0); }
    }
    .p1-top-triangle {
      position: absolute;
      top: 0; left: 56%;
      width: 70px; height: 120px;
      background: var(--val-red);
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }
    .p1-double-chevrons {
      position: absolute;
      top: 38px; left: 130px;
      display: flex; gap: 5px; z-index: 90;
    }
    .chev-blade {
      width: 11px; height: 16px;
      background: var(--val-red);
      clip-path: polygon(0 0, 50% 0, 100% 100%, 50% 100%);
    }
    .p1-dynamic-pip {
      position: absolute;
      top: 118px; left: 378px;
      width: 12px; height: 12px;
      background: var(--val-red);
      z-index: 90;
      will-change: transform;
      animation: pipDriftLeft 0.52s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes pipDriftLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-65px); }
    }
    .p1-dynamic-arrow {
      position: absolute;
      top: 136px; left: 546px;
      width: 16px; height: 11px;
      background: var(--val-red);
      clip-path: polygon(0% 0%, 65% 0%, 100% 50%, 65% 100%, 0% 100%);
      z-index: 90;
      will-change: transform;
      animation: arrowDriftLeft 0.52s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes arrowDriftLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-21px); }
    }

    /* V4 Phase 2: Frames 35 - 64 ("F" Kinetic Assembly on Red) */
    #v4-phase-2 {
      position: absolute;
      inset: 0;
      display: none;
      background: var(--val-red);
      overflow: hidden;
    }
    .f-push-wrapper {
      position: absolute;
      inset: 0;
      will-change: transform;
      animation: cameraLeftToRightPush 0.8s cubic-bezier(0.12, 0.85, 0.25, 1) forwards;
    }
    @keyframes cameraLeftToRightPush {
      0% { transform: translateX(-40px); }
      100% { transform: translateX(35px); }
    }
    .f-main-spine {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 27%;
      background: var(--val-dark);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }
    .f-top-bar {
      position: absolute;
      top: 0; left: 27%;
      width: 45%; height: 26%;
      background: var(--val-dark);
    }
    .f-elevating-slab {
      position: absolute;
      left: 27%; bottom: 32%;
      width: 33%; height: 24%;
      background: var(--val-dark);
      will-change: transform;
      animation: slabElevateUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slabElevateUp {
      0% { transform: translateY(110px); }
      100% { transform: translateY(0); }
    }
    .f-right-void-shutter {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 28%;
      background: var(--val-red);
      will-change: transform;
      animation: rightSideOpen 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes rightSideOpen {
      0% { transform: translateX(0); }
      100% { transform: translateX(110%); }
    }
    .f-micro-chevrons {
      position: absolute;
      top: 48px; right: 190px;
      display: flex; gap: 6px; z-index: 80;
      animation: fChevDrift 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes fChevDrift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-24px); }
    }
    .f-chev-blade {
      width: 12px; height: 18px;
      background: var(--val-dark);
      clip-path: polygon(0 0, 50% 0, 100% 100%, 50% 100%);
    }
    .f-micro-drifting-bar {
      position: absolute;
      top: 73px; left: 623px;
      width: 80px; height: 4px;
      background: var(--val-dark);
      z-index: 80;
      animation: barDriftUpLeft 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes barDriftUpLeft {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-23px, -14px); }
    }
    .f-micro-center-arrow {
      position: absolute;
      top: 236px; left: 597px;
      width: 17px; height: 12px;
      background: var(--val-dark);
      clip-path: polygon(0% 15%, 60% 15%, 100% 50%, 60% 85%, 0% 85%);
      z-index: 80;
      animation: centerArrowSweep 0.75s cubic-bezier(0.1, 0.85, 0.25, 1) forwards;
    }
    @keyframes centerArrowSweep {
      0% { transform: translateX(0); }
      100% { transform: translateX(-102px); }
    }
    .f-micro-lower-sq {
      position: absolute;
      top: 366px; left: 501px;
      width: 10px; height: 10px;
      background: var(--val-dark);
      z-index: 80;
      animation: lowerSqSlide 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes lowerSqSlide {
      0% { transform: translateX(0); }
      100% { transform: translateX(-23px); }
    }
    .f-diagonal-axis {
      position: absolute;
      width: 140vw; height: 1px;
      background: rgba(15, 25, 35, 0.35);
      top: 15%; left: -20%;
      transform: rotate(45deg);
      pointer-events: none; z-index: 60;
    }

    /* ========================================================
       2. SCENE V9: TRUE MM CONVERGING ARCHITECTURE
       ======================================================== */
    #scene-v9 {
      background: var(--val-dark);
    }
    .v9-hairline {
      position: absolute;
      width: 160vw; height: 1px;
      background: rgba(255,70,85,0.22);
      top: 8%; left: -20%;
      transform: rotate(45deg);
      transform-origin: top left;
      pointer-events: none; z-index: 40;
    }
    .v9-left-leg {
      position: absolute;
      left: -2%; top: -8%; bottom: -8%;
      width: 58%;
      background: var(--val-red);
      clip-path: polygon(
        0% 100%, 0% 0%, 22% 0%, 50% 58%, 78% 0%, 100% 0%,
        100% 100%, 78% 100%, 78% 18%, 50% 75%, 22% 18%, 22% 100%
      );
      will-change: transform;
      animation: v9LeftLeg 1.2s cubic-bezier(0.08, 0.92, 0.18, 1) forwards;
    }
    @keyframes v9LeftLeg {
      0%   { transform: translateX(-110%); }
      60%  { transform: translateX(-6%); }
      80%  { transform: translateX(2%); }
      100% { transform: translateX(0); }
    }
    .v9-right-leg {
      position: absolute;
      right: -2%; top: -8%; bottom: -8%;
      width: 58%;
      background: var(--val-red);
      clip-path: polygon(
        100% 100%, 100% 0%, 78% 0%, 50% 58%, 22% 0%, 0% 0%,
        0% 100%, 22% 100%, 22% 18%, 50% 75%, 78% 18%, 78% 100%
      );
      will-change: transform;
      animation: v9RightLeg 1.2s cubic-bezier(0.08, 0.92, 0.18, 1) forwards;
    }
    @keyframes v9RightLeg {
      0%   { transform: translateX(110%); }
      60%  { transform: translateX(6%); }
      80%  { transform: translateX(-2%); }
      100% { transform: translateX(0); }
    }
    .v9-arrow-pip {
      position: absolute;
      top: 50%; left: 38%;
      transform: translateY(-50%);
      width: 18px; height: 13px;
      background: var(--val-red);
      clip-path: polygon(0% 15%, 60% 15%, 100% 50%, 60% 85%, 0% 85%);
      z-index: 80;
      animation: v9ArrowPip 1.4s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      animation-delay: 0.3s;
      opacity: 0;
    }
    @keyframes v9ArrowPip {
      0%   { left: 28%; opacity: 0; }
      15%  { opacity: 1; }
      100% { left: 66%; opacity: 1; }
    }
    .v9-chevrons {
      position: absolute;
      top: 56px; right: 28%;
      display: flex; gap: 6px; z-index: 75;
      animation: v9ChevDrift 1.3s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes v9ChevDrift {
      0%   { transform: translateX(55px); }
      100% { transform: translateX(0); }
    }
    .v9-chev {
      width: 11px; height: 17px;
      background: var(--val-red);
      clip-path: polygon(0 0, 50% 0, 100% 100%, 50% 100%);
    }
    .v9-pip-left {
      position: absolute;
      left: 42px; top: 370px;
      width: 12px; height: 12px;
      background: var(--val-red);
      animation: v9PipDrift 1.3s linear forwards;
    }
    @keyframes v9PipDrift {
      0%   { transform: translateX(30px); }
      100% { transform: translateX(-10px); }
    }
    .v9-pip-right {
      position: absolute;
      right: 22px; bottom: 42px;
      width: 12px; height: 12px;
      background: var(--val-red);
      animation: v9RightPip 1.3s linear forwards;
    }
    @keyframes v9RightPip {
      0%   { transform: translateX(-20px); }
      100% { transform: translateX(0); }
    }

    /* ========================================================
       3. SCENE V10: NVIR RED BUILD
       ======================================================== */
    #scene-v10 {
      background: var(--val-red);
    }
    .v10-hairline {
      position: absolute;
      width: 140vw; height: 1px;
      background: rgba(15,25,35,0.35);
      top: 10%; right: -10%;
      transform: rotate(45deg);
      transform-origin: top right;
      pointer-events: none; z-index: 40;
    }
    .v10-v-shape {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 44%;
      background: var(--val-dark);
      clip-path: polygon(
        0% 0%, 18% 0%, 55% 100%, 42% 100%, 82% 0%, 100% 0%, 100% 100%, 0% 100%
      );
      will-change: transform;
      animation: v10VSlide 1.0s cubic-bezier(0.12, 0.98, 0.24, 1) forwards;
    }
    @keyframes v10VSlide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(0); }
    }
    .v10-i-top {
      position: absolute;
      left: 44.5%; top: 31.8%;
      width: 10.2%; height: 21.3%;
      background: var(--val-dark);
      opacity: 0;
      animation: v10TopAppear 0.2s ease-out 0.05s forwards;
    }
    @keyframes v10TopAppear {
      0%   { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .v10-i-bot {
      position: absolute;
      left: 44.5%; top: 81.5%;
      width: 10.2%; height: 18.5%;
      background: var(--val-dark);
      opacity: 0;
      animation: v10BotAppear 0.2s ease-out 0.1s forwards;
    }
    @keyframes v10BotAppear {
      0%   { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .v10-i-stem {
      position: absolute;
      left: 44.5%; top: 53.2%;
      width: 10.2%; height: 0%;
      background: var(--val-dark);
      transform-origin: top center;
      animation: v10StemDrop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    @keyframes v10StemDrop {
      0%   { height: 0%; }
      100% { height: 28.3%; }
    }
    .v10-r-body {
      position: absolute;
      right: 0; top: 29.6%; bottom: 0;
      width: 24%;
      background: var(--val-dark);
      clip-path: polygon(
        0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 60%, 30% 45%, 0% 30%
      );
      will-change: transform;
      animation: v10RSlide 1.0s cubic-bezier(0.12, 0.98, 0.24, 1) forwards;
    }
    .v10-r-slash {
      position: absolute;
      left: 76.6%; top: 0;
      width: 8.2%; height: 23.2%;
      background: var(--val-dark);
      clip-path: polygon(0% 0%, 100% 0%, 100% 60%, 0% 100%);
      will-change: transform;
      animation: v10RSlide 1.0s cubic-bezier(0.12, 0.98, 0.24, 1) forwards;
    }
    @keyframes v10RSlide {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(0); }
    }
    .v10-chevrons {
      position: absolute;
      top: 268px; left: 155px;
      display: flex; gap: 6px; z-index: 75;
      animation: v10ChevDrift 1.25s cubic-bezier(0.15,0.8,0.2,1) forwards;
    }
    @keyframes v10ChevDrift {
      0%   { transform: translateX(-20px); opacity:0.5; }
      100% { transform: translateX(0); opacity:1; }
    }
    .v10-chev {
      width: 12px; height: 18px;
      background: var(--val-dark);
      clip-path: polygon(0 0, 50% 0, 100% 100%, 50% 100%);
    }
    .v10-arrow-pip {
      position: absolute;
      top: 224px; left: 599px;
      width: 16px; height: 11px;
      background: var(--val-dark);
      clip-path: polygon(0% 15%, 65% 15%, 100% 50%, 65% 85%, 0% 85%);
      z-index: 75;
      animation: v10ArrowDrift 1.25s linear forwards;
    }
    @keyframes v10ArrowDrift {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-30px); }
    }
    .v10-horiz-bar-1 {
      position: absolute;
      top: 158px; left: 468px;
      width: 80px; height: 4px;
      background: var(--val-dark);
      z-index: 75;
    }
    .v10-horiz-bar-2 {
      position: absolute;
      top: 166px; left: 468px;
      width: 80px; height: 2px;
      background: var(--val-dark);
      opacity: 0.5; z-index: 75;
    }
    .v10-horiz-bar-bot {
      position: absolute;
      bottom: 80px; left: 468px;
      width: 80px; height: 4px;
      background: var(--val-dark);
      z-index: 75;
    }

    /* Common HUD text style */
    .hud-label {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.3em;
      z-index: 80;
    }

    /* Bottom Control Bar */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show { opacity: 1; }
    .btn {
      background: rgba(15,25,35,0.85);
      border: 1px solid rgba(255,255,255,0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.25em;
      padding: 9px 16px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-red);
      border-color: var(--val-red);
      color: var(--val-white);
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <!-- Media Audio Source (Direct from Valorant Trim.mp4 video) -->
  <video id="reveal-media" style="display:none;" preload="auto">
    <source src="../Valorant logo reveal animation _Project A_ - Trim.mp4" type="video/mp4" />
    <source src="../reveal_audio.webm" type="audio/webm" />
  </video>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V11 // V4 + V9 + V10</div>
      <div class="splash-sub">VALORANT TRIM AUDIO // CONTINUOUS KINETIC SEQUENCE</div>
    </div>
  </div>

  <!-- Top Active Scene Tracker -->
  <div class="scene-hud" id="scene-hud">
    <div class="hud-badge" id="badge-v4">1 // V4 ("F" BUILD)</div>
    <div class="hud-badge" id="badge-v9">2 // V9 (MM ARCHITECTURE)</div>
    <div class="hud-badge" id="badge-v10">3 // V10 (NVIR BUILD)</div>
  </div>

  <div id="master-stage">

    <!-- ===================================================
         SCENE 1: V4 ("F" BUILD)
         =================================================== -->
    <div class="scene-container" id="scene-v4">
      <!-- V4 Phase 1: Frames 1 - 31 -->
      <div id="v4-phase-1">
        <div class="p1-left-wall"></div>
        <div class="p1-right-wedge"></div>
        <div class="p1-top-triangle"></div>
        <div class="p1-double-chevrons">
          <div class="chev-blade"></div>
          <div class="chev-blade"></div>
        </div>
        <div class="p1-dynamic-pip"></div>
        <div class="p1-dynamic-arrow"></div>
        <div class="hud-label" style="top:25px; left:48px; color:rgba(255,70,85,0.7);">01 // SYSTEM_INIT // F_PRCL</div>
      </div>

      <!-- V4 Phase 2: Frames 35 - 64 -->
      <div id="v4-phase-2">
        <div class="f-diagonal-axis"></div>
        <div class="f-push-wrapper">
          <div class="f-main-spine"></div>
          <div class="f-top-bar"></div>
          <div class="f-elevating-slab" id="f-slab"></div>
          <div class="f-right-void-shutter" id="right-void"></div>
        </div>
        <div class="f-micro-chevrons">
          <div class="f-chev-blade"></div>
          <div class="f-chev-blade"></div>
        </div>
        <div class="f-micro-drifting-bar"></div>
        <div class="f-micro-center-arrow"></div>
        <div class="f-micro-lower-sq"></div>
        <div class="hud-label" style="top:35px; right:48px; color:rgba(15,25,35,0.7);">01 // TACTICAL_F // KINETIC</div>
      </div>
    </div>

    <!-- ===================================================
         SCENE 2: V9 (TRUE MM ARCHITECTURE)
         =================================================== -->
    <div class="scene-container" id="scene-v9">
      <div class="v9-hairline"></div>
      <div class="v9-left-leg" id="v9-left-leg"></div>
      <div class="v9-right-leg" id="v9-right-leg"></div>
      <div class="v9-arrow-pip" id="v9-pip"></div>
      <div class="v9-chevrons">
        <div class="v9-chev"></div>
        <div class="v9-chev"></div>
      </div>
      <div class="v9-pip-left"></div>
      <div class="v9-pip-right"></div>
      <div class="hud-label" style="top:28px; left:60px; color:rgba(255,70,85,0.6);">// VLRNT // MM_OUTER_LEGS</div>
      <div class="hud-label" style="bottom:28px; right:60px; color:rgba(255,70,85,0.6);">AHAMMAD // AXIS_SYMMETRY</div>
    </div>

    <!-- ===================================================
         SCENE 3: V10 (NVIR RED BUILD)
         =================================================== -->
    <div class="scene-container" id="scene-v10">
      <div class="v10-hairline"></div>
      <div class="v10-v-shape" id="v10-v"></div>
      <div class="v10-r-body" id="v10-r-body"></div>
      <div class="v10-r-slash" id="v10-r-slash"></div>
      <div class="v10-i-top" id="v10-i-top"></div>
      <div class="v10-i-bot" id="v10-i-bot"></div>
      <div class="v10-i-stem" id="v10-i-stem"></div>
      <div class="v10-chevrons">
        <div class="v10-chev"></div>
        <div class="v10-chev"></div>
      </div>
      <div class="v10-arrow-pip"></div>
      <div class="v10-horiz-bar-1"></div>
      <div class="v10-horiz-bar-2"></div>
      <div class="v10-horiz-bar-bot"></div>
      <div class="hud-label" style="top:44px; left:88px; color:rgba(15,25,35,0.65);">// VLRNT // NVIR_CONSTRUCT</div>
      <div class="hud-label" style="top:225px; left:430px; color:rgba(15,25,35,0.65);">BIND   MRCS</div>
      <div class="hud-label" style="top:240px; left:430px; color:rgba(15,25,35,0.65);">SPLT   JPN</div>
    </div>

  </div>

  <!-- Bottom Nav Controls -->
  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">↺ REPLAY FULL SEQUENCE (V4+V9+V10)</button>
    <button class="btn" id="jump-v4">V4 ONLY</button>
    <button class="btn" id="jump-v9">V9 ONLY</button>
    <button class="btn" id="jump-v10">V10 ONLY</button>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const media = document.getElementById('reveal-media');
    const sceneHud = document.getElementById('scene-hud');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');

    const sc4 = document.getElementById('scene-v4');
    const v4p1 = document.getElementById('v4-phase-1');
    const v4p2 = document.getElementById('v4-phase-2');
    const fSlab = document.getElementById('f-slab');
    const rightVoid = document.getElementById('right-void');

    const sc9 = document.getElementById('scene-v9');
    const sc10 = document.getElementById('scene-v10');

    const badge4 = document.getElementById('badge-v4');
    const badge9 = document.getElementById('badge-v9');
    const badge10 = document.getElementById('badge-v10');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    function resetElementAnimations(container) {
      const els = container.querySelectorAll('*');
      els.forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight; // force reflow
        el.style.animation = '';
      });
    }

    function setBadge(num) {
      [badge4, badge9, badge10].forEach(b => b.classList.remove('active'));
      if (num === 4) badge4.classList.add('active');
      if (num === 9) badge9.classList.add('active');
      if (num === 10) badge10.classList.add('active');
    }

    function startAudio(time = 0) {
      try {
        media.currentTime = time;
        const p = media.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      sceneHud.classList.add('show');
      playFullSequence();
    });

    async function playFullSequence() {
      navBar.classList.remove('show');
      sc4.style.display = 'none';
      v4p1.style.display = 'none';
      v4p2.style.display = 'none';
      sc9.style.display = 'none';
      sc10.style.display = 'none';

      // Start audio from beginning of video
      startAudio(0);

      /* ========================================================
         STEP 1: SCENE V4 ("F" BUILD) — Frames 1 - 64 (~1.3s)
         ======================================================== */
      setBadge(4);
      sc4.style.display = 'block';

      // V4 Phase 1: Frames 1 - 31 (~520ms)
      resetElementAnimations(v4p1);
      v4p1.style.display = 'block';
      v4p2.style.display = 'none';
      await wait(520);

      // V4 Phase 2: Frames 35 - 64 (~780ms)
      v4p1.style.display = 'none';
      resetElementAnimations(v4p2);
      v4p2.style.display = 'block';
      fSlab.style.animation = 'slabElevateUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards';
      rightVoid.style.animation = 'rightSideOpen 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards';
      await wait(780);

      /* ========================================================
         STEP 2: SCENE V9 (TRUE MM ARCHITECTURE) (~1.4s)
         ======================================================== */
      sc4.style.display = 'none';
      setBadge(9);
      resetElementAnimations(sc9);
      sc9.style.display = 'block';
      await wait(1400);

      /* ========================================================
         STEP 3: SCENE V10 (NVIR RED BUILD) (~1.35s)
         ======================================================== */
      sc9.style.display = 'none';
      setBadge(10);
      resetElementAnimations(sc10);
      sc10.style.display = 'block';
      await wait(1350);

      navBar.classList.add('show');
    }

    /* Single scene playback helpers */
    async function playSolo(num) {
      navBar.classList.remove('show');
      sc4.style.display = 'none';
      v4p1.style.display = 'none';
      v4p2.style.display = 'none';
      sc9.style.display = 'none';
      sc10.style.display = 'none';
      setBadge(num);

      if (num === 4) {
        startAudio(0);
        sc4.style.display = 'block';
        resetElementAnimations(v4p1);
        v4p1.style.display = 'block';
        await wait(520);
        v4p1.style.display = 'none';
        resetElementAnimations(v4p2);
        v4p2.style.display = 'block';
        fSlab.style.animation = 'slabElevateUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards';
        rightVoid.style.animation = 'rightSideOpen 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards';
        await wait(780);
      } else if (num === 9) {
        startAudio(1.6);
        resetElementAnimations(sc9);
        sc9.style.display = 'block';
        await wait(1400);
      } else if (num === 10) {
        startAudio(1.15);
        resetElementAnimations(sc10);
        sc10.style.display = 'block';
        await wait(1350);
      }
      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => { e.stopPropagation(); playFullSequence(); });
    document.getElementById('jump-v4').addEventListener('click', (e) => { e.stopPropagation(); playSolo(4); });
    document.getElementById('jump-v9').addEventListener('click', (e) => { e.stopPropagation(); playSolo(9); });
    document.getElementById('jump-v10').addEventListener('click', (e) => { e.stopPropagation(); playSolo(10); });
  </script>
</body>
</html>
