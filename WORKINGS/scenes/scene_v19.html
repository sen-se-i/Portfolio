<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE V19 // AUTHENTIC VALORANT GLYPH GENESIS ➔ FAHIM HIGHWAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 900;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255,70,85,0.4);
      padding: 28px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: rgba(255,70,85,0.04);
      position: relative;
    }
    .splash-box::before {
      content: ''; position: absolute; top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red); border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: ''; position: absolute; bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red); border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-family: 'Valorant', sans-serif;
      font-size: 26px;
      letter-spacing: 0.22em;
      color: var(--val-white);
      text-align: center;
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }

    /* Master Stage */
    #stage {
      position: fixed;
      inset: 0;
      background: var(--val-red);
      overflow: hidden;
      display: none;
      z-index: 50;
    }

    /* 45-degree Thin Diagonal Hairline across Stage */
    .hairline-axis {
      position: absolute;
      width: 180vw;
      height: 1.5px;
      background: rgba(15, 25, 35, 0.42);
      top: -10%;
      left: 10%;
      transform: rotate(45deg);
      transform-origin: top left;
      pointer-events: none;
      z-index: 60;
    }

    /* Left Edge Dark Chevron Pip (x=38px, y=245px) */
    .left-chevron-pip {
      position: absolute;
      top: 48%;
      left: 38px;
      width: 16px;
      height: 12px;
      background: var(--val-dark);
      clip-path: polygon(0% 15%, 65% 15%, 100% 50%, 65% 85%, 0% 85%);
      z-index: 80;
    }

    /* Center Stationary Dash Stems (I-bars) */
    .center-stem-left {
      position: absolute;
      top: 47%;
      left: 28%;
      width: 16px;
      height: 38px;
      background: var(--val-dark);
      z-index: 80;
    }
    .center-stem-right {
      position: absolute;
      top: 49%;
      left: 51%;
      width: 16px;
      height: 38px;
      background: var(--val-dark);
      z-index: 80;
    }

    /* Initial Center Anchor Bars (Frame 265) */
    .anchor-left {
      position: absolute;
      top: 46%;
      left: 18%;
      width: 128px;
      height: 58px;
      background: var(--val-dark);
      z-index: 75;
      animation: anchorBreakLeft 0.35s cubic-bezier(0.8, 0, 0.2, 1) forwards;
    }
    @keyframes anchorBreakLeft {
      0%   { opacity: 1; transform: scale(1); }
      60%  { opacity: 1; transform: scaleX(0.7) translateX(-20px); }
      100% { opacity: 0; transform: scaleX(0.1) translateX(-60px); }
    }

    .anchor-right {
      position: absolute;
      top: 52%;
      left: 54%;
      width: 128px;
      height: 58px;
      background: var(--val-dark);
      z-index: 75;
      animation: anchorBreakRight 0.35s cubic-bezier(0.8, 0, 0.2, 1) forwards;
    }
    @keyframes anchorBreakRight {
      0%   { opacity: 1; transform: scale(1); }
      60%  { opacity: 1; transform: scaleX(0.7) translateX(20px); }
      100% { opacity: 0; transform: scaleX(0.1) translateX(60px); }
    }

    /* ========================================================
       CORE CONTINUOUS TRACKS (100% PERSISTENT, DIRECT SLIDE)
       Lane 2: Upper-Middle (180° Inverted, slides LEFT)
       Lane 3: Lower-Middle (Upright, slides RIGHT)
       ======================================================== */

    .track-3 {
      position: absolute;
      top: 51%;
      left: 0;
      width: 100vw;
      height: 150px;
      z-index: 75;
      will-change: transform;
      animation: track3ContinuousMotion 1.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes track3ContinuousMotion {
      0%   { transform: translateX(-4vw); }
      100% { transform: translateX(18vw); }
    }

    .track-2 {
      position: absolute;
      top: 17%;
      left: 0;
      width: 100vw;
      height: 150px;
      transform: rotate(180deg);
      transform-origin: center center;
      z-index: 75;
      will-change: transform;
      animation: track2ContinuousMotion 1.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes track2ContinuousMotion {
      0%   { transform: rotate(180deg) translateX(-4vw); }
      100% { transform: rotate(180deg) translateX(18vw); }
    }

    /* Word Box Container using ACTUAL VALORANT FONT */
    .fahim-word-container {
      display: flex;
      align-items: center;
      gap: 2.2vw;
      padding-left: 10vw;
    }

    /* The Individual Valorant Font Letter Box */
    .v-letter {
      position: relative;
      font-family: 'Valorant', sans-serif;
      font-size: 132px;
      line-height: 1;
      color: var(--val-dark);
      display: inline-block;
      will-change: clip-path, transform, opacity;
    }

    /* ========================================================
       GEOMETRIC DECONSTRUCTION & PROGRESSIVE BUILD ON EACH LETTER:
       Smooth, fluid polygon growth without sharp snaps
       ======================================================== */

    /* --- LETTER F GENESIS --- */
    .v-letter.char-f {
      animation: buildLetterF 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.04s both;
    }
    @keyframes buildLetterF {
      0% {
        clip-path: polygon(0 0, 32% 0, 32% 100%, 0 100%);
        transform: translateY(-30px);
        opacity: 0;
      }
      35% {
        clip-path: polygon(0 0, 32% 0, 32% 100%, 0 100%);
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* --- LETTER A GENESIS --- */
    .v-letter.char-a {
      animation: buildLetterA 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both;
    }
    @keyframes buildLetterA {
      0% {
        clip-path: polygon(40% 0, 60% 0, 50% 100%, 50% 100%);
        transform: scale(0.6);
        opacity: 0;
      }
      45% {
        clip-path: polygon(15% 0, 85% 0, 100% 100%, 0% 100%);
        transform: scale(1);
        opacity: 1;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transform: scale(1);
        opacity: 1;
      }
    }

    /* --- LETTER H GENESIS --- */
    .v-letter.char-h {
      animation: buildLetterH 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
    }
    @keyframes buildLetterH {
      0% {
        clip-path: polygon(0 0, 32% 0, 32% 100%, 0 100%);
        transform: translateY(30px);
        opacity: 0;
      }
      40% {
        clip-path: polygon(0 0, 32% 0, 32% 100%, 0 100%, 68% 0, 100% 0, 100% 100%, 68% 100%);
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* --- LETTER I GENESIS --- */
    .v-letter.char-i {
      animation: buildLetterI 0.3s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both;
    }
    @keyframes buildLetterI {
      0% {
        transform: scaleY(0.2) translateY(-40px);
        opacity: 0;
      }
      100% {
        transform: scaleY(1) translateY(0);
        opacity: 1;
      }
    }

    /* --- LETTER M GENESIS --- */
    .v-letter.char-m {
      animation: buildLetterM 0.36s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
    }
    @keyframes buildLetterM {
      0% {
        clip-path: polygon(0 0, 25% 0, 25% 100%, 0 100%);
        transform: scaleX(0.5);
        opacity: 0;
      }
      45% {
        clip-path: polygon(0 0, 70% 0, 70% 100%, 0 100%);
        transform: scaleX(0.85);
        opacity: 1;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transform: scaleX(1);
        opacity: 1;
      }
    }

    /* ========================================================
       ROOF & FLOOR HIGHWAYS (Frames 271-274)
       Sequential emergence after the center pieces lock
       ======================================================== */
    /* Roof and Floor Highways */
    .roof-highway {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 12%;
      overflow: hidden;
      z-index: 70;
      opacity: 0;
      animation: outerHighwayPop 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
    }
    .floor-highway {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12%;
      overflow: hidden;
      z-index: 70;
      opacity: 0;
      animation: outerHighwayPop 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
    }
    @keyframes outerHighwayPop {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }

    .roof-content {
      position: absolute;
      bottom: -13vh;
      left: 0;
      display: flex;
      gap: 5vw;
      font-family: 'Valorant', sans-serif;
      font-size: 24vh;
      line-height: 1;
      color: var(--val-dark);
      white-space: nowrap;
      animation: roofGlide 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
    }
    @keyframes roofGlide {
      0%   { transform: translateX(-15vw); }
      100% { transform: translateX(12vw); }
    }

    .floor-content {
      position: absolute;
      top: -13vh;
      left: 0;
      display: flex;
      gap: 5vw;
      font-family: 'Valorant', sans-serif;
      font-size: 24vh;
      line-height: 1;
      color: var(--val-dark);
      transform: rotate(180deg);
      transform-origin: center center;
      white-space: nowrap;
      animation: floorGlide 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
    }
    @keyframes floorGlide {
      0%   { transform: rotate(180deg) translateX(-25vw); }
      100% { transform: rotate(180deg) translateX(12vw); }
    }

    /* Technical HUD Details */
    .hud-label {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: rgba(15, 25, 35, 0.75);
      z-index: 85;
    }
    .micro-dash {
      position: absolute;
      height: 3px;
      background: var(--val-dark);
      z-index: 85;
    }
    .micro-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--val-dark);
      z-index: 85;
    }

    /* Replay Button */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show { opacity: 1; }
    .btn {
      background: rgba(15,25,35,0.85);
      border: 1px solid rgba(255,255,255,0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.25em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-dark);
      border-color: var(--val-white);
      color: var(--val-red);
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <!-- Background Audio -->
  <video id="reveal-media" style="display:none;" preload="auto">
    <source src="../Valorant logo reveal animation _Project A_ - Trim.mp4" type="video/mp4" />
    <source src="../reveal_audio.webm" type="audio/webm" />
  </video>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V19 // AUTHENTIC FAHIM GLYPH GENESIS</div>
      <div class="splash-sub">100% VALORANT FONT // GEOMETRIC SLICE BUILD</div>
    </div>
  </div>

  <!-- Master Stage -->
  <div id="stage">
    <div class="hairline-axis"></div>

    <!-- Center Static Elements from Frames 265-282 -->
    <div class="left-chevron-pip"></div>
    <div class="center-stem-left"></div>
    <div class="center-stem-right"></div>

    <!-- Initial Center Anchor Bars (Frame 265) -->
    <div class="anchor-left" id="anchor-left"></div>
    <div class="anchor-right" id="anchor-right"></div>

    <!-- ========================================================
         LANE 2: UPPER-MIDDLE (180° INVERTED "FAHIM")
         The exact Valorant letters build geometrically, lock, and SLIDE LEFT!
         ======================================================== -->
    <div class="track-2" id="track-2">
      <div class="fahim-word-container">
        <span class="v-letter char-f">F</span>
        <span class="v-letter char-a">A</span>
        <span class="v-letter char-h">H</span>
        <span class="v-letter char-i">I</span>
        <span class="v-letter char-m">M</span>
      </div>
    </div>

    <!-- ========================================================
         LANE 3: LOWER-MIDDLE (UPRIGHT "FAHIM")
         The exact Valorant letters build geometrically, lock, and SLIDE RIGHT!
         ======================================================== -->
    <div class="track-3" id="track-3">
      <div class="fahim-word-container">
        <span class="v-letter char-f">F</span>
        <span class="v-letter char-a">A</span>
        <span class="v-letter char-h">H</span>
        <span class="v-letter char-i">I</span>
        <span class="v-letter char-m">M</span>
      </div>
    </div>

    <!-- ========================================================
         ROOF & FLOOR HIGHWAYS (Frames 271-274)
         Sequential emergence after the center pieces lock
         ======================================================== -->
    <div class="roof-highway" id="roof-highway">
      <div class="roof-content">
        <span>FAHIM</span>
        <span>FAHIM</span>
      </div>
    </div>

    <div class="floor-highway" id="floor-highway">
      <div class="floor-content">
        <span>FAHIM</span>
        <span>FAHIM</span>
      </div>
    </div>

    <!-- Technical HUD Details -->
    <div class="micro-dash" style="top: 24%; left: 5%; width: 56px;"></div>
    <div class="micro-dash" style="top: 24%; right: 9%; width: 56px;"></div>
    <div class="micro-dash" style="top: 70%; right: 9%; width: 64px;"></div>
    
    <div class="micro-dot" style="top: 36%; left: 16%;"></div>
    <div class="micro-dot" style="top: 36%; left: 32%;"></div>
    <div class="micro-dot" style="top: 66%; right: 16%;"></div>
    <div class="micro-dot" style="top: 74%; right: 16%;"></div>

    <div class="hud-label" style="top: 36%; left: 27%;">VLRNT // SWE_23</div>
    <div class="hud-label" style="top: 90%; left: 28%;">PRTCL // FAHIM</div>
    <div class="hud-label" style="top: 10%; right: 10%;">BIND // HAVEN</div>
    <div class="hud-label" style="top: 90%; right: 10%;">SUST // SWE</div>
  </div>

  <!-- Replay Button -->
  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">↺ REPLAY "FAHIM" GENESIS</button>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const media = document.getElementById('reveal-media');
    const stage = document.getElementById('stage');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    function startAudio() {
      try {
        media.currentTime = 10.0;
        const p = media.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      playGlyphGenesis();
    });

    async function playGlyphGenesis() {
      navBar.classList.remove('show');
      stage.style.display = 'none';

      // Reset all animations inside stage
      stage.querySelectorAll('*').forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });

      startAudio();
      stage.style.display = 'block';

      // 1.45s duration
      await wait(1450);

      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playGlyphGenesis();
    });
  </script>
</body>
</html>
