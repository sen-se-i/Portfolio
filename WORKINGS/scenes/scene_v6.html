<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE PROTOTYPE V6 // FRAMES 134 - 147 EXACT GEOMETRY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
      --val-cyan: #00f5d4;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Valorant', sans-serif;
      position: relative;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.16) 3px,
        rgba(0, 0, 0, 0.16) 4px
      );
      pointer-events: none;
      z-index: 950;
    }

    /* 1-Click Gate */
    #start-splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #start-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255, 70, 85, 0.4);
      padding: 26px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 70, 85, 0.04);
      position: relative;
    }
    .splash-box::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red);
      border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: '';
      position: absolute;
      bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red);
      border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-size: 30px;
      letter-spacing: 0.25em;
      color: var(--val-white);
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.45em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* Master Stage: Solid Crimson Red (Frames 134-147) */
    #stage-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--val-red);
      z-index: 50;
    }

    /* ============================================================
       THE 134 - 147 EXACT GEOMETRIC SCENE
       1. Left Massive Chevron that ENTERS from bottom-left (Frames 140->147)
       2. Left Center Dark Spine (x: 28% to 40%)
       3. Central Vertical Red Divider Stripe (at 40%)
       4. Right Massive M/R Geometric Angled Leg (Frames 138->147)
       5. The Measured Floating Micro-Shapes:
          - Arrow Pip at center (x: 757 -> 748, y: 124)
          - Corner Chevron Pair (x: 934 -> 906, y: 132)
          - Left Horizontal Indicator Bar (x: 114 to 274, y: 264)
          - Right Slit Box (x: 1217 -> 1208, y: 410)
       ============================================================ */
    #scene-134-container {
      position: absolute;
      inset: 0;
      display: none;
      background: var(--val-red);
      overflow: hidden;
    }

    /* 1. Left Center Dark Spine */
    .spine-left-block {
      position: absolute;
      left: 28%;
      top: 0;
      bottom: 0;
      width: 12%;
      background: var(--val-dark);
    }

    /* 2. Central Vertical Razor Thin Red Divider Stripe */
    .center-razor-divider {
      position: absolute;
      left: 40%;
      top: 0;
      bottom: 0;
      width: 16px;
      background: var(--val-red);
      z-index: 60;
    }

    /* 3. The Left Incoming Massive Chevron (Enters diagonally from bottom-left) */
    .left-entering-chevron {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 28%;
      height: 75%;
      background: var(--val-dark);
      clip-path: polygon(0 40%, 45% 0, 100% 50%, 100% 100%, 45% 55%, 0 95%);
      will-change: transform;
      animation: chevronBurstIn 0.42s cubic-bezier(0.12, 0.9, 0.2, 1) forwards;
    }
    @keyframes chevronBurstIn {
      0% {
        transform: translate(-90px, 80px);
        opacity: 0.4;
      }
      100% {
        transform: translate(0, 0);
        opacity: 1;
      }
    }

    /* 4. The Right Massive Angled Geometric M/R Leg (Frames 138-147) */
    .right-geometric-m-leg {
      position: absolute;
      left: 41.5%;
      top: 0;
      right: 0;
      bottom: 0;
      background: var(--val-dark);
      clip-path: polygon(
        0% 0%, 100% 0%, 100% 100%, 75% 100%,
        55% 40%, 35% 40%, 25% 68%, 25% 100%, 0% 100%
      );
      will-change: transform;
      animation: rightLegDrift 0.45s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes rightLegDrift {
      0% { transform: translateX(20px); }
      100% { transform: translateX(0); }
    }

    /* --- THE EXACT MEASURED FLOATING MICRO-SHAPES (Frames 134-147) --- */

    /* Shape A: Center Arrow Pointer (Drifts left: x 757 -> 748, y: 124) */
    .m134-center-arrow {
      position: absolute;
      top: 118px;
      left: 757px;
      width: 18px;
      height: 12px;
      background: var(--val-dark);
      clip-path: polygon(0% 0%, 65% 0%, 100% 50%, 65% 100%, 0% 100%);
      z-index: 85;
      will-change: transform;
      animation: arrowSlideLeft134 0.45s linear forwards;
    }
    @keyframes arrowSlideLeft134 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-10px); }
    }

    /* Shape B: Top-Right Double Chevrons (x 934 -> 906, y: 130) */
    .m134-double-chevrons {
      position: absolute;
      top: 122px;
      left: 934px;
      display: flex;
      gap: 5px;
      z-index: 85;
      will-change: transform;
      animation: chevsSlideLeft134 0.45s linear forwards;
    }
    @keyframes chevsSlideLeft134 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-28px); }
    }
    .m134-chev {
      width: 10px;
      height: 14px;
      background: var(--val-dark);
      clip-path: polygon(0 0, 50% 0, 100% 100%, 50% 100%);
    }

    /* Shape C: Left Horizontal Indicator Bar (x: 114, y: 264) */
    .m134-horiz-indicator {
      position: absolute;
      top: 262px;
      left: 114px;
      width: 160px;
      height: 6px;
      background: var(--val-dark);
      z-index: 85;
      will-change: transform;
      animation: horizBarSlide134 0.45s linear forwards;
    }
    @keyframes horizBarSlide134 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-8px); }
    }

    /* Shape D: Right Tech Slit Box (x 1217 -> 1208, y: 410) */
    .m134-right-slit {
      position: absolute;
      top: 405px;
      left: 1217px;
      width: 18px;
      height: 18px;
      background: var(--val-dark);
      z-index: 85;
      will-change: transform;
      animation: rightSlitSlide134 0.45s linear forwards;
    }
    @keyframes rightSlitSlide134 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-9px); }
    }

    /* Technical Coordinates */
    .m134-coord {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.35em;
      color: var(--val-dark);
      opacity: 0.65;
    }

    /* Replay Nav */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show {
      opacity: 1;
    }
    .btn {
      background: rgba(15, 25, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-dark);
      border-color: var(--val-white);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>

  <!-- Audio -->
  <audio id="reveal-audio" preload="auto">
    <source src="../reveal_audio.webm" type="audio/webm" />
  </audio>

  <!-- 1-Click Gate -->
  <div id="start-splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V6 // FRAMES 134 - 147</div>
      <div class="splash-sub">CLICK TO PLAY EXACT GEOMETRIC TRANSITION</div>
    </div>
  </div>

  <div id="stage-container">

    <div id="scene-134-container">
      <!-- 1. Left Center Dark Spine -->
      <div class="spine-left-block"></div>

      <!-- 2. Central Razor Divider -->
      <div class="center-razor-divider"></div>

      <!-- 3. Left Incoming Chevron (Enters from bottom-left!) -->
      <div class="left-entering-chevron" id="left-chev"></div>

      <!-- 4. Right Massive Geometric M/R Angled Leg -->
      <div class="right-geometric-m-leg"></div>

      <!-- EXACT MEASURED MOVING BACKGROUND MICRO-SHAPES -->
      <div class="m134-center-arrow"></div>
      <div class="m134-double-chevrons">
        <div class="m134-chev"></div>
        <div class="m134-chev"></div>
      </div>
      <div class="m134-horiz-indicator"></div>
      <div class="m134-right-slit"></div>

      <!-- Coordinates -->
      <div class="m134-coord" style="top: 30px; left: 40px;">03 // TRANSITION_BEAT // FRAMES_134_147</div>
      <div class="m134-coord" style="bottom: 30px; right: 40px;">35.48.36.N // 139.45.03.E</div>
    </div>

  </div>

  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">REPLAY 134 - 147</button>
  </div>

  <script>
    const splash = document.getElementById('start-splash');
    const audio = document.getElementById('reveal-audio');
    const scContainer = document.getElementById('scene-134-container');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');
    const leftChev = document.getElementById('left-chev');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      audio.currentTime = 2.25; // Timestamp for frame 134 transition
      audio.play().catch(e => console.log('Audio error:', e));
      run134Sequence();
    });

    async function run134Sequence() {
      scContainer.style.display = 'none';
      navBar.classList.remove('show');

      // Reset animations
      leftChev.style.animation = 'none';
      leftChev.offsetHeight;
      leftChev.style.animation = 'chevronBurstIn 0.42s cubic-bezier(0.12, 0.9, 0.2, 1) forwards';

      scContainer.style.display = 'block';
      await wait(550);

      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      run134Sequence();
    });
  </script>
</body>
</html>
