<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE PROTOTYPE V8 // AUTHENTIC VALORANT MIRRORED "MM"</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
      --val-cyan: #00f5d4;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Valorant', sans-serif;
      position: relative;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.16) 3px,
        rgba(0, 0, 0, 0.16) 4px
      );
      pointer-events: none;
      z-index: 950;
    }

    /* 1-Click Unlock Gate */
    #start-splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #start-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255, 70, 85, 0.4);
      padding: 26px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 70, 85, 0.04);
      position: relative;
    }
    .splash-box::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red);
      border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: '';
      position: absolute;
      bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red);
      border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-size: 30px;
      letter-spacing: 0.25em;
      color: var(--val-white);
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.45em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* Master Stage: Deep Dark Navy */
    #stage-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--val-dark);
      z-index: 50;
    }

    /* ============================================================
       AUTHENTIC VALORANT MIRRORED "M M" ASSEMBLY
       Rendered with true official font glyphs!
       Left 'M' and Right Mirrored 'M' (scaleX: -1)
       Inward kinetic slamming assembly + Floating background elements!
       ============================================================ */
    #mm-container {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: clamp(40px, 8vw, 140px);
      background: var(--val-dark);
      overflow: hidden;
    }

    /* Left Real Valorant 'M' */
    .val-m-left {
      font-family: 'Valorant', sans-serif;
      font-size: clamp(260px, 34vw, 500px);
      line-height: 0.8;
      color: var(--val-red);
      will-change: transform, opacity;
      animation: mLeftInward 0.62s cubic-bezier(0.12, 0.9, 0.2, 1) forwards;
    }
    @keyframes mLeftInward {
      0% {
        transform: translateX(-120px) scale(1.18);
        opacity: 0.3;
      }
      100% {
        transform: translateX(0) scale(1);
        opacity: 1;
      }
    }

    /* Right Real Valorant 'M' (Mirrored horizontally!) */
    .val-m-right-mirror {
      font-family: 'Valorant', sans-serif;
      font-size: clamp(260px, 34vw, 500px);
      line-height: 0.8;
      color: var(--val-red);
      transform: scaleX(-1);
      will-change: transform, opacity;
      animation: mRightMirrorInward 0.62s cubic-bezier(0.12, 0.9, 0.2, 1) forwards;
    }
    @keyframes mRightMirrorInward {
      0% {
        transform: scaleX(-1) translateX(-120px) scale(1.18);
        opacity: 0.3;
      }
      100% {
        transform: scaleX(-1) translateX(0) scale(1);
        opacity: 1;
      }
    }

    /* --- ACTIVE MOVING BACKGROUND MICRO-SHAPES --- */

    /* Shape 1: Top-Right Double Chevrons (x: 888px, y: 54px) */
    .mm-chevrons-drift {
      position: absolute;
      top: 48px;
      right: 22%;
      display: flex;
      gap: 6px;
      z-index: 80;
      will-change: transform;
      animation: chevDriftLeft 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes chevDriftLeft {
      0% { transform: translateX(35px); }
      100% { transform: translateX(0); }
    }
    .chev-blade {
      width: 12px;
      height: 18px;
      background: var(--val-red);
      clip-path: polygon(0 0, 50% 0, 100% 100%, 50% 100%);
    }

    /* Shape 2: Left Floating Horizontal Indicator Bar (x: 72 -> 112px, y: 442px) */
    .mm-horiz-bar {
      position: absolute;
      bottom: 85px;
      left: 70px;
      width: 75px;
      height: 6px;
      background: var(--val-red);
      z-index: 80;
      will-change: transform;
      animation: horizBarSlide 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes horizBarSlide {
      0% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }

    /* Shape 3: Center Arrow Pip near symmetry line (x: 562 -> 545px) */
    .mm-arrow-pip {
      position: absolute;
      top: 36%;
      left: 49%;
      width: 14px;
      height: 10px;
      background: var(--val-red);
      clip-path: polygon(0% 0%, 65% 0%, 100% 50%, 65% 100%, 0% 100%);
      z-index: 80;
      will-change: transform;
      animation: arrowPipMove 0.75s linear forwards;
    }
    @keyframes arrowPipMove {
      0% { transform: translateX(20px); }
      100% { transform: translateX(-15px); }
    }

    /* Shape 4: 45-degree Diagonal Construction Hairline */
    .mm-hairline-axis {
      position: absolute;
      width: 160vw;
      height: 1px;
      background: rgba(255, 70, 85, 0.25);
      top: 15%;
      left: -20%;
      transform: rotate(45deg);
      pointer-events: none;
      z-index: 40;
    }

    /* Technical HUD Coordinates */
    .mm-coord {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.35em;
      color: rgba(255, 70, 85, 0.6);
      z-index: 80;
    }

    /* Replay Nav */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show {
      opacity: 1;
    }
    .btn {
      background: rgba(15, 25, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-red);
      border-color: var(--val-red);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>

  <!-- Audio -->
  <audio id="reveal-audio" preload="auto">
    <source src="../reveal_audio.webm" type="audio/webm" />
  </audio>

  <!-- 1-Click Gate -->
  <div id="start-splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V8 // TRUE MIRRORED "MM"</div>
      <div class="splash-sub">CLICK TO PLAY OFFICIAL VALORANT FONT ASSEMBLY</div>
    </div>
  </div>

  <div id="stage-container">

    <div id="mm-container">
      <div class="mm-hairline-axis"></div>

      <!-- TRUE VALORANT FONT M M (Left Normal, Right Mirrored!) -->
      <div class="val-m-left" id="m-left">M</div>
      <div class="val-m-right-mirror" id="m-right">M</div>

      <!-- Active Moving Background Micro-Shapes -->
      <div class="mm-chevrons-drift">
        <div class="chev-blade"></div>
        <div class="chev-blade"></div>
      </div>
      <div class="mm-horiz-bar"></div>
      <div class="mm-arrow-pip"></div>

      <!-- HUD Tags -->
      <div class="mm-coord" style="top: 36px; left: 60px;">// VLRNT // MIRRORED_MM_CONSTRUCT</div>
      <div class="mm-coord" style="bottom: 36px; right: 60px;">AXIS_SYMMETRY // AHAMMAD</div>
    </div>

  </div>

  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">REPLAY TRUE "M M"</button>
  </div>

  <script>
    const splash = document.getElementById('start-splash');
    const audio = document.getElementById('reveal-audio');
    const mmContainer = document.getElementById('mm-container');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');
    const mLeft = document.getElementById('m-left');
    const mRight = document.getElementById('m-right');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      audio.currentTime = 1.65;
      audio.play().catch(e => console.log('Audio error:', e));
      runTrueMMSequence();
    });

    async function runTrueMMSequence() {
      mmContainer.style.display = 'none';
      navBar.classList.remove('show');

      // Reset animations
      mLeft.style.animation = 'none';
      mRight.style.animation = 'none';
      mLeft.offsetHeight;
      mRight.offsetHeight;
      mLeft.style.animation = 'mLeftInward 0.62s cubic-bezier(0.12, 0.9, 0.2, 1) forwards';
      mRight.style.animation = 'mRightMirrorInward 0.62s cubic-bezier(0.12, 0.9, 0.2, 1) forwards';

      mmContainer.style.display = 'flex';
      await wait(850);

      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      runTrueMMSequence();
    });
  </script>
</body>
</html>
