<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE PROTOTYPE V5 // MIRRORED "M" "M" GEOMETRIC ARCHITECTURE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
      --val-cyan: #00f5d4;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Valorant', sans-serif;
      position: relative;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.16) 3px,
        rgba(0, 0, 0, 0.16) 4px
      );
      pointer-events: none;
      z-index: 950;
    }

    /* 1-Click Audio Unlock Gate */
    #start-splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #start-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255, 70, 85, 0.4);
      padding: 26px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 70, 85, 0.04);
      position: relative;
    }
    .splash-box::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red);
      border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: '';
      position: absolute;
      bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red);
      border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-size: 30px;
      letter-spacing: 0.25em;
      color: var(--val-white);
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.45em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* Master Stage */
    #stage-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--val-dark);
      z-index: 50;
    }

    /* ============================================================
       THE MIRRORED "M" "M" GEOMETRIC SCENE (Frames 99 - 132)
       Exact Frame 105, 115, 125:
       1. Left Massive 45-degree Diagonal Blade of 'M' (Moving rightward)
       2. Right Symmetrical 45-degree Inverted Diagonal Blade of 'M' (Moving leftward)
       3. Center Vertical Twin Pillars of 'M'
       4. Top Massive Red Beam forming the M crown
       5. Floating Micro-Pips:
          - Bottom Right Sliding Bar (x: 801 -> 832, y: 442px)
          - Center Tracking Arrow (x: 562 -> 558, y: 158px)
          - Left Bottom Flashing Square (x: 39 -> 27, y: 373px)
       ============================================================ */
    #mm-stage {
      position: absolute;
      inset: 0;
      display: none;
      background: var(--val-dark);
      overflow: hidden;
    }

    /* Top Massive Red Header Bar */
    .mm-top-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 60%;
      height: 24%;
      background: var(--val-red);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 65% 100%, 65% 55%, 0 55%);
      will-change: transform;
      animation: headerSlamDown 0.45s cubic-bezier(0.12, 0.85, 0.2, 1) forwards;
    }
    @keyframes headerSlamDown {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(0); }
    }

    /* Left Diagonal Blade of First 'M' */
    .m-left-diagonal {
      position: absolute;
      left: 12%;
      top: -10%;
      bottom: -10%;
      width: 28%;
      background: var(--val-red);
      clip-path: polygon(35% 0%, 75% 0%, 40% 100%, 0% 100%);
      will-change: transform;
      animation: mLeftSlide 0.75s cubic-bezier(0.12, 0.8, 0.2, 1) forwards;
    }
    @keyframes mLeftSlide {
      0% { transform: translate(-50px, -20px); }
      100% { transform: translate(0, 0); }
    }

    /* Right Inverted Diagonal Blade of Mirrored 'M' */
    .m-right-diagonal {
      position: absolute;
      right: 12%;
      top: -10%;
      bottom: -10%;
      width: 28%;
      background: var(--val-red);
      clip-path: polygon(25% 0%, 65% 0%, 100% 100%, 60% 100%);
      will-change: transform;
      animation: mRightSlide 0.75s cubic-bezier(0.12, 0.8, 0.2, 1) forwards;
    }
    @keyframes mRightSlide {
      0% { transform: translate(50px, -20px); }
      100% { transform: translate(0, 0); }
    }

    /* Center Twin Vertical Pillars */
    .m-pillar-1 {
      position: absolute;
      left: 54%;
      top: 0;
      width: 6.5%;
      height: 48%;
      background: var(--val-red);
      will-change: transform;
      animation: pillar1Drop 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .m-pillar-2 {
      position: absolute;
      left: 63%;
      top: 0;
      width: 6.5%;
      height: 48%;
      background: var(--val-red);
      will-change: transform;
      animation: pillar2Drop 0.62s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes pillar1Drop {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(0); }
    }
    @keyframes pillar2Drop {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(0); }
    }

    /* Lower Right Corner Triangle */
    .mm-corner-blade {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 18%;
      height: 38%;
      background: var(--val-red);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    /* --- THE MEASURED MICRO-DETAILS IN FRAMES 99-130 --- */

    /* 1. Bottom-Right Sliding Bar (x: 801 -> 832px, y: 442px) */
    .mm-micro-bar {
      position: absolute;
      top: 440px;
      left: 801px;
      width: 44px;
      height: 8px;
      background: var(--val-red);
      z-index: 85;
      will-change: transform;
      animation: microBarSlide 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes microBarSlide {
      0% { transform: translateX(0); }
      100% { transform: translateX(31px); } /* 801 + 31 = 832px exact! */
    }

    /* 2. Center Tracking Arrow (x: 562 -> 558px, y: 158px) */
    .mm-micro-arrow {
      position: absolute;
      top: 154px;
      left: 562px;
      width: 16px;
      height: 12px;
      background: var(--val-red);
      clip-path: polygon(0% 0%, 65% 0%, 100% 50%, 65% 100%, 0% 100%);
      z-index: 85;
      will-change: transform;
      animation: microArrowSlide 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes microArrowSlide {
      0% { transform: translateX(0); }
      100% { transform: translateX(-6px); }
    }

    /* 3. Left Flashing Square & Pip (x: 39 -> 27px, y: 373px) */
    .mm-micro-sq {
      position: absolute;
      top: 368px;
      left: 39px;
      width: 12px;
      height: 12px;
      background: var(--val-red);
      z-index: 85;
      will-change: transform;
      animation: microSqDrift 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes microSqDrift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-12px); }
    }

    /* 4. Diagonal Hairline Axis (From top left to bottom right) */
    .mm-diagonal-line {
      position: absolute;
      width: 160vw;
      height: 1px;
      background: rgba(255, 70, 85, 0.25);
      top: 0;
      left: -20%;
      transform: rotate(45deg);
      transform-origin: top left;
      pointer-events: none;
      z-index: 60;
    }

    /* Technical Coordinate Marks */
    .mm-coord {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.35em;
      color: rgba(255, 70, 85, 0.6);
    }

    /* Replay Nav */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show {
      opacity: 1;
    }
    .btn {
      background: rgba(15, 25, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-red);
      border-color: var(--val-red);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>

  <!-- Audio -->
  <audio id="reveal-audio" preload="auto">
    <source src="../reveal_audio.webm" type="audio/webm" />
  </audio>

  <!-- 1-Click Unlock Gate -->
  <div id="start-splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V5 // MIRRORED "M" "M"</div>
      <div class="splash-sub">CLICK TO PLAY FRAMES 99 - 132 GEOMETRY</div>
    </div>
  </div>

  <div id="stage-container">

    <div id="mm-stage">
      <div class="mm-diagonal-line"></div>

      <!-- Structural M Geometry -->
      <div class="mm-top-header"></div>
      <div class="m-left-diagonal"></div>
      <div class="m-right-diagonal"></div>
      <div class="m-pillar-1"></div>
      <div class="m-pillar-2"></div>
      <div class="mm-corner-blade"></div>

      <!-- Exact Measured Micro-Moving Shapes -->
      <div class="mm-micro-bar"></div>
      <div class="mm-micro-arrow"></div>
      <div class="mm-micro-sq"></div>

      <!-- Technical HUD Tags -->
      <div class="mm-coord" style="top: 36px; right: 60px;">02 // MIRRORED_CONSTRUCT // MM</div>
      <div class="mm-coord" style="bottom: 36px; left: 60px;">PRTCL // AXIS_SYMMETRY</div>
    </div>

  </div>

  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">REPLAY "M M" BUILD</button>
  </div>

  <script>
    const splash = document.getElementById('start-splash');
    const audio = document.getElementById('reveal-audio');
    const mmStage = document.getElementById('mm-stage');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      audio.currentTime = 1.65; // Jump right to Scene 2 (M M) audio timestamp
      audio.play().catch(e => console.log('Audio error:', e));
      runMMSequence();
    });

    async function runMMSequence() {
      mmStage.style.display = 'none';
      navBar.classList.remove('show');

      // Re-trigger animations
      const elements = mmStage.querySelectorAll('div');
      elements.forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight; // reflow
        el.style.animation = '';
      });

      mmStage.style.display = 'block';
      await wait(850);

      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      runMMSequence();
    });
  </script>
</body>
</html>
