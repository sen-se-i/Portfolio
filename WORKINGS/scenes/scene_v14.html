<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE V14 // JOINED V12 ("T V R") + V13 ("AHAMMAD") SEQUENCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }

    /* Cinematic Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 900;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255,70,85,0.4);
      padding: 28px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: rgba(255,70,85,0.04);
      position: relative;
    }
    .splash-box::before {
      content: ''; position: absolute; top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red); border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: ''; position: absolute; bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red); border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-family: 'Valorant', sans-serif;
      font-size: 26px;
      letter-spacing: 0.22em;
      color: var(--val-white);
      text-align: center;
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }

    /* Top Scene Tracker HUD */
    .scene-hud {
      position: fixed;
      top: 20px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 800;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .scene-hud.show { opacity: 1; }
    .hud-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.25em;
      padding: 5px 12px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(8,12,16,0.65);
      color: rgba(255,255,255,0.6);
      transition: all 0.25s;
    }
    .hud-badge.active {
      border-color: var(--val-red);
      background: rgba(255,70,85,0.25);
      color: var(--val-white);
    }

    /* Master Stage */
    #master-stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 50;
    }

    .scene-layer {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
    }

    /* ========================================================
       1. SCENE V12: "T V R" RED SNAP & SPREAD (FRAMES 239 - 254)
       ======================================================== */
    #scene-v12 {
      background: var(--val-red);
    }

    .v12-hairline {
      position: absolute;
      width: 180vw;
      height: 1px;
      background: rgba(15, 25, 35, 0.38);
      top: 5%;
      left: -20%;
      transform: rotate(45deg);
      transform-origin: top left;
      pointer-events: none;
      z-index: 60;
    }

    .v12-top-container {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 38%;
      overflow: hidden;
      z-index: 70;
    }

    .v12-top-content {
      position: absolute;
      bottom: -6vh;
      left: 0;
      display: flex;
      gap: 8vw;
      font-family: 'Valorant', sans-serif;
      font-size: 52vh;
      line-height: 1;
      color: var(--val-dark);
      will-change: transform, letter-spacing;
      animation: v12TopSlide 1.35s cubic-bezier(0.12, 0.94, 0.22, 1) forwards;
    }
    @keyframes v12TopSlide {
      0%   { transform: translateX(45vw); letter-spacing: 0em; }
      75%  { transform: translateX(-4vw); letter-spacing: 0.04em; }
      100% { transform: translateX(-14vw); letter-spacing: 0.12em; } /* Spread anticipation */
    }

    .v12-bot-container {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 34%;
      overflow: hidden;
      z-index: 70;
    }

    .v12-bot-content {
      position: absolute;
      top: -2vh;
      left: 0;
      display: flex;
      gap: 8vw;
      font-family: 'Valorant', sans-serif;
      font-size: 52vh;
      line-height: 1;
      color: var(--val-dark);
      will-change: transform, letter-spacing;
      animation: v12BotSlide 1.35s cubic-bezier(0.12, 0.94, 0.22, 1) forwards;
    }
    @keyframes v12BotSlide {
      0%   { transform: translateX(-8vw); letter-spacing: 0em; }
      75%  { transform: translateX(36vw); letter-spacing: 0.04em; }
      100% { transform: translateX(48vw); letter-spacing: 0.12em; } /* Spread anticipation */
    }

    .v12-micro-dash {
      position: absolute;
      top: 45%; left: 49%;
      width: 32px; height: 4px;
      background: var(--val-dark);
      z-index: 80;
    }

    .v12-micro-dot {
      position: absolute;
      width: 5px; height: 5px;
      background: var(--val-dark);
      z-index: 80;
    }

    /* ========================================================
       2. SCENE V13: "AHAMMAD" OPPOSING TRACKS (FRAMES 255 - 264)
       ======================================================== */
    #scene-v13 {
      background: var(--val-dark);
    }

    .v13-hairline {
      position: absolute;
      width: 180vw;
      height: 1px;
      background: rgba(255, 70, 85, 0.22);
      top: 8%;
      left: -20%;
      transform: rotate(45deg);
      transform-origin: top left;
      pointer-events: none;
      z-index: 60;
    }

    .v13-top-container {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 36%;
      overflow: hidden;
      z-index: 70;
    }

    .v13-top-content {
      position: absolute;
      bottom: -6vh;
      left: 0;
      display: flex;
      gap: 6vw;
      font-family: 'Valorant', sans-serif;
      font-size: 50vh;
      line-height: 1;
      color: var(--val-red);
      will-change: transform;
      animation: v13TopDrift 1.25s cubic-bezier(0.12, 0.96, 0.24, 1) forwards;
    }
    @keyframes v13TopDrift {
      0%   { transform: translateX(4vw); }
      100% { transform: translateX(18vw); }
    }

    .v13-bot-container {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 33%;
      overflow: hidden;
      z-index: 70;
    }

    .v13-bot-content {
      position: absolute;
      top: -2vh;
      left: 0;
      display: flex;
      gap: 6vw;
      font-family: 'Valorant', sans-serif;
      font-size: 50vh;
      line-height: 1;
      color: var(--val-red);
      will-change: transform;
      animation: v13BotDrift 1.25s cubic-bezier(0.12, 0.96, 0.24, 1) forwards;
    }
    @keyframes v13BotDrift {
      0%   { transform: translateX(8vw); }
      100% { transform: translateX(-6vw); }
    }

    .v13-arrow-pip {
      position: absolute;
      top: 48%; left: 45%;
      width: 17px; height: 12px;
      background: var(--val-red);
      clip-path: polygon(0% 15%, 65% 15%, 100% 50%, 65% 85%, 0% 85%);
      z-index: 80;
      will-change: transform;
      animation: v13ArrowShoot 1.1s cubic-bezier(0.15, 0.9, 0.2, 1) 0.05s forwards;
    }
    @keyframes v13ArrowShoot {
      0%   { transform: translateX(0); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translateX(30vw); opacity: 1; }
    }

    /* Common HUD Label */
    .hud-label {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.3em;
      z-index: 85;
    }

    /* Bottom Nav Bar */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show { opacity: 1; }
    .btn {
      background: rgba(15,25,35,0.85);
      border: 1px solid rgba(255,255,255,0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.25em;
      padding: 9px 16px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-red);
      border-color: var(--val-red);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <!-- Audio from Trimmed Video -->
  <video id="reveal-media" style="display:none;" preload="auto">
    <source src="../Valorant logo reveal animation _Project A_ - Trim.mp4" type="video/mp4" />
    <source src="../reveal_audio.webm" type="audio/webm" />
  </video>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V14 // V12 + V13 SEQUENCE</div>
      <div class="splash-sub">CLICK TO PLAY "T V R" SNAP ➔ "AHAMMAD" FLIP</div>
    </div>
  </div>

  <!-- Top Active Scene Tracker -->
  <div class="scene-hud" id="scene-hud">
    <div class="hud-badge" id="badge-v12">1 // V12 ("T V R" RED SNAP)</div>
    <div class="hud-badge" id="badge-v13">2 // V13 ("AHAMMAD" OPPOSING FLIP)</div>
  </div>

  <div id="master-stage">

    <!-- ===================================================
         SCENE 1: V12 ("T V R" RED SNAP & SPREAD)
         =================================================== -->
    <div class="scene-layer" id="scene-v12">
      <div class="v12-hairline"></div>

      <!-- Top Track: T V R sliding left -->
      <div class="v12-top-container">
        <div class="v12-top-content" id="v12-top">
          <span>T</span>
          <span>V</span>
          <span>R</span>
        </div>
      </div>

      <!-- Bottom Track: T V R sliding right -->
      <div class="v12-bot-container">
        <div class="v12-bot-content" id="v12-bot">
          <span>T</span>
          <span>V</span>
          <span>R</span>
        </div>
      </div>

      <div class="v12-micro-dash"></div>
      <div class="v12-micro-dot" style="top: 20%; left: 84%;"></div>
      <div class="v12-micro-dot" style="top: 36%; left: 84%;"></div>
      <div class="v12-micro-dot" style="top: 68%; left: 84%;"></div>
      <div class="v12-micro-dot" style="top: 84%; left: 84%;"></div>

      <div class="hud-label" style="top: 24%; left: 86%; color:rgba(15,25,35,0.72);">07 // AYALC</div>
      <div class="hud-label" style="top: 36%; left: 86%; color:rgba(15,25,35,0.72);">01</div>
      <div class="hud-label" style="top: 48%; left: 47%; color:rgba(15,25,35,0.72);">HAVEN</div>
      <div class="hud-label" style="top: 88%; left: 35%; color:rgba(15,25,35,0.72);">SPLT // JPN</div>
    </div>

    <!-- ===================================================
         SCENE 2: V13 ("AHAMMAD" OPPOSING FLIP)
         =================================================== -->
    <div class="scene-layer" id="scene-v13">
      <div class="v13-hairline"></div>

      <!-- Top Track: ... A M M A D -->
      <div class="v13-top-container">
        <div class="v13-top-content" id="v13-top">
          <span>A</span>
          <span>M</span>
          <span>M</span>
          <span>A</span>
          <span>D</span>
        </div>
      </div>

      <!-- Bottom Track: A H A M M ... -->
      <div class="v13-bot-container">
        <div class="v13-bot-content" id="v13-bot">
          <span>A</span>
          <span>H</span>
          <span>A</span>
          <span>M</span>
          <span>M</span>
        </div>
      </div>

      <!-- Center Void Micro-details -->
      <div class="v13-arrow-pip" id="v13-arrow"></div>
      <div class="hud-label" style="top: 42%; left: 42%; color:rgba(255,70,85,0.55);">// AHAMMAD // PROTOCOL</div>
      <div class="hud-label" style="top: 54%; left: 42%; color:rgba(255,70,85,0.55);">SYS_ID // SWE_23</div>
      <div class="hud-label" style="top: 44%; right: 12%; color:rgba(255,70,85,0.55);">SUST // CSE_SUST</div>
    </div>

  </div>

  <!-- Bottom Navigation Controls -->
  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">↺ REPLAY FULL (V12 + V13)</button>
    <button class="btn" id="jump-v12">V12 ONLY</button>
    <button class="btn" id="jump-v13">V13 ONLY</button>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const media = document.getElementById('reveal-media');
    const sceneHud = document.getElementById('scene-hud');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');

    const sc12 = document.getElementById('scene-v12');
    const v12Top = document.getElementById('v12-top');
    const v12Bot = document.getElementById('v12-bot');

    const sc13 = document.getElementById('scene-v13');
    const v13Top = document.getElementById('v13-top');
    const v13Bot = document.getElementById('v13-bot');
    const v13Arrow = document.getElementById('v13-arrow');

    const badge12 = document.getElementById('badge-v12');
    const badge13 = document.getElementById('badge-v13');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    function resetElementAnimations(container) {
      const els = container.querySelectorAll('*');
      els.forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });
    }

    function setBadge(num) {
      [badge12, badge13].forEach(b => b.classList.remove('active'));
      if (num === 12) badge12.classList.add('active');
      if (num === 13) badge13.classList.add('active');
    }

    function startAudio(time = 9.85) {
      try {
        media.currentTime = time;
        const p = media.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      sceneHud.classList.add('show');
      playFullSequence();
    });

    async function playFullSequence() {
      navBar.classList.remove('show');
      sc12.style.display = 'none';
      sc13.style.display = 'none';

      // Start audio at frame 239 sound burst
      startAudio(9.85);

      /* ========================================================
         STEP 1: SCENE V12 ("T V R" RED SNAP & SPREAD) (~1.35s)
         ======================================================== */
      setBadge(12);
      resetElementAnimations(sc12);
      sc12.style.display = 'block';
      await wait(1350);

      /* ========================================================
         STEP 2: INSTANT SHOCK CUT TO SCENE V13 ("AHAMMAD") (~1.25s)
         ======================================================== */
      sc12.style.display = 'none';
      setBadge(13);
      resetElementAnimations(sc13);
      sc13.style.display = 'block';
      await wait(1300);

      navBar.classList.add('show');
    }

    async function playSolo(num) {
      navBar.classList.remove('show');
      sc12.style.display = 'none';
      sc13.style.display = 'none';
      setBadge(num);

      if (num === 12) {
        startAudio(9.85);
        resetElementAnimations(sc12);
        sc12.style.display = 'block';
        await wait(1350);
      } else if (num === 13) {
        startAudio(10.2);
        resetElementAnimations(sc13);
        sc13.style.display = 'block';
        await wait(1300);
      }
      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => { e.stopPropagation(); playFullSequence(); });
    document.getElementById('jump-v12').addEventListener('click', (e) => { e.stopPropagation(); playSolo(12); });
    document.getElementById('jump-v13').addEventListener('click', (e) => { e.stopPropagation(); playSolo(13); });
  </script>
</body>
</html>
