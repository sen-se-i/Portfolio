<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE V17 // TRUE GEOMETRIC DECONSTRUCTION ➔ "FAHIM" GENESIS (FRAMES 265 - 282)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 900;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255,70,85,0.4);
      padding: 28px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: rgba(255,70,85,0.04);
      position: relative;
    }
    .splash-box::before {
      content: ''; position: absolute; top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red); border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: ''; position: absolute; bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red); border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-family: 'Valorant', sans-serif;
      font-size: 26px;
      letter-spacing: 0.22em;
      color: var(--val-white);
      text-align: center;
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }

    /* Master Stage */
    #stage {
      position: fixed;
      inset: 0;
      background: var(--val-red);
      overflow: hidden;
      display: none;
      z-index: 50;
    }

    /* 45-degree Thin Diagonal Hairline across Stage */
    .hairline-axis {
      position: absolute;
      width: 180vw;
      height: 1.5px;
      background: rgba(15, 25, 35, 0.42);
      top: -10%;
      left: 10%;
      transform: rotate(45deg);
      transform-origin: top left;
      pointer-events: none;
      z-index: 60;
    }

    /* Left Edge Dark Chevron Pip (x=38px, y=245px) */
    .left-chevron-pip {
      position: absolute;
      top: 48%;
      left: 38px;
      width: 16px;
      height: 12px;
      background: var(--val-dark);
      clip-path: polygon(0% 15%, 65% 15%, 100% 50%, 65% 85%, 0% 85%);
      z-index: 80;
    }

    /* Center Stationary Dash Stems (I-bars) */
    .center-stem-left {
      position: absolute;
      top: 47%;
      left: 28%;
      width: 16px;
      height: 38px;
      background: var(--val-dark);
      z-index: 80;
    }
    .center-stem-right {
      position: absolute;
      top: 49%;
      left: 51%;
      width: 16px;
      height: 38px;
      background: var(--val-dark);
      z-index: 80;
    }

    /* ========================================================
       PHASE 1: THE TWO INITIAL SOLID ANCHOR BARS (Frame 265)
       ======================================================== */
    .anchor-left {
      position: absolute;
      top: 46%;
      left: 18%;
      width: 128px;
      height: 58px;
      background: var(--val-dark);
      z-index: 75;
      animation: anchorBreakLeft 0.35s cubic-bezier(0.8, 0, 0.2, 1) forwards;
    }
    @keyframes anchorBreakLeft {
      0%   { opacity: 1; transform: scale(1); }
      60%  { opacity: 1; transform: scaleX(0.7) translateX(-20px); }
      100% { opacity: 0; transform: scaleX(0.1) translateX(-60px); }
    }

    .anchor-right {
      position: absolute;
      top: 52%;
      left: 54%;
      width: 128px;
      height: 58px;
      background: var(--val-dark);
      z-index: 75;
      animation: anchorBreakRight 0.35s cubic-bezier(0.8, 0, 0.2, 1) forwards;
    }
    @keyframes anchorBreakRight {
      0%   { opacity: 1; transform: scale(1); }
      60%  { opacity: 1; transform: scaleX(0.7) translateX(20px); }
      100% { opacity: 0; transform: scaleX(0.1) translateX(60px); }
    }

    /* ========================================================
       PHASE 2: INDIVIDUAL LETTER PIECE GENESIS (Frames 266 - 270)
       Each letter of FAHIM is built from geometric strokes:
       - F: Stem + Top Bar + Mid Crossbar
       - A: Left Blade + Right Blade + Apex
       - H: Left Pillar + Right Pillar + Connector Bridge
       - I: Solid Monolithic Pillar
       - M: Left Vertical + Diag Left + Diag Right + Right Vertical
       ======================================================== */

    .geo-build-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 72;
    }

    /* Individual Geometric Stroke Unit */
    .geo-part {
      position: absolute;
      background: var(--val-dark);
      will-change: transform, opacity;
    }

    /* --- LETTER F GENESIS (Lane 3, left side) --- */
    /* Vertical stem of F */
    .f-stem {
      top: 52%;
      left: 10%;
      width: 26px;
      height: 120px;
      animation: fStemBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.08s forwards;
    }
    @keyframes fStemBuild {
      0%   { transform: scaleY(0.1) translateY(-60px); opacity: 0; }
      40%  { opacity: 1; }
      100% { transform: scaleY(1) translateY(0); opacity: 1; }
    }
    /* Top horizontal bar of F */
    .f-top-bar {
      top: 52%;
      left: 10%;
      width: 80px;
      height: 24px;
      animation: fBarBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.14s forwards;
    }
    /* Middle crossbar of F */
    .f-mid-bar {
      top: 61%;
      left: 10%;
      width: 54px;
      height: 22px;
      animation: fBarBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.18s forwards;
    }
    @keyframes fBarBuild {
      0%   { transform: scaleX(0.1); opacity: 0; }
      40%  { opacity: 1; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    /* --- LETTER A GENESIS --- */
    /* Left diagonal blade */
    .a-blade-l {
      top: 52%;
      left: 20%;
      width: 26px;
      height: 120px;
      transform-origin: top center;
      animation: aBladeLBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.12s forwards;
    }
    @keyframes aBladeLBuild {
      0%   { transform: rotate(-22deg) scaleY(0.2); opacity: 0; }
      50%  { opacity: 1; }
      100% { transform: rotate(-22deg) scaleY(1); opacity: 1; }
    }
    /* Right diagonal blade */
    .a-blade-r {
      top: 52%;
      left: 25%;
      width: 26px;
      height: 120px;
      transform-origin: top center;
      animation: aBladeRBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.14s forwards;
    }
    @keyframes aBladeRBuild {
      0%   { transform: rotate(22deg) scaleY(0.2); opacity: 0; }
      50%  { opacity: 1; }
      100% { transform: rotate(22deg) scaleY(1); opacity: 1; }
    }
    /* Crossbar of A */
    .a-crossbar {
      top: 62%;
      left: 19%;
      width: 60px;
      height: 20px;
      animation: aCrossBuild 0.38s cubic-bezier(0.12, 0.95, 0.2, 1) 0.2s forwards;
    }
    @keyframes aCrossBuild {
      0%   { transform: scaleX(0.2); opacity: 0; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    /* --- LETTER H GENESIS --- */
    .h-pillar-l {
      top: 52%;
      left: 32%;
      width: 26px;
      height: 120px;
      animation: fStemBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.15s forwards;
    }
    .h-pillar-r {
      top: 52%;
      left: 37%;
      width: 26px;
      height: 120px;
      animation: fStemBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.17s forwards;
    }
    .h-bridge {
      top: 61%;
      left: 32%;
      width: 90px;
      height: 22px;
      animation: aCrossBuild 0.38s cubic-bezier(0.12, 0.95, 0.2, 1) 0.22s forwards;
    }

    /* --- LETTER I GENESIS --- */
    .i-pillar {
      top: 52%;
      left: 45%;
      width: 26px;
      height: 120px;
      animation: fStemBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.2s forwards;
    }

    /* --- LETTER M GENESIS (Dual Converging Pillars) --- */
    .m-pillar-l {
      top: 52%;
      left: 52%;
      width: 26px;
      height: 120px;
      animation: fStemBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.22s forwards;
    }
    .m-diag-l {
      top: 52%;
      left: 54%;
      width: 26px;
      height: 90px;
      transform: rotate(26deg);
      transform-origin: top left;
      animation: aBladeLBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.24s forwards;
    }
    .m-diag-r {
      top: 52%;
      left: 58%;
      width: 26px;
      height: 90px;
      transform: rotate(-26deg);
      transform-origin: top right;
      animation: aBladeRBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.24s forwards;
    }
    .m-pillar-r {
      top: 52%;
      left: 60%;
      width: 26px;
      height: 120px;
      animation: fStemBuild 0.4s cubic-bezier(0.12, 0.95, 0.2, 1) 0.26s forwards;
    }

    /* 
       AFTER THE PIECES LOCK TOGETHER (at ~0.42s),
       They seamlessly blend into the kinetic sliding lanes!
    */
    .geo-build-container {
      animation: geoContainerTransition 0.25s ease 0.42s forwards;
    }
    @keyframes geoContainerTransition {
      0%   { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }

    /* ========================================================
       PHASE 3: FULL 4-LANE PROGRESSIVE APPEARANCE (Frames 270 - 282)
       Core lanes slide at 0.42s; Outer lanes appear sequentially letter-by-letter!
       ======================================================== */

    /* Core Lane 2 (Upper Middle - 180° Inverted) */
    .lane-2-container {
      position: absolute;
      top: 20%;
      left: 0;
      right: 0;
      height: 26%;
      overflow: hidden;
      z-index: 70;
      opacity: 0;
      animation: laneReveal 0.95s cubic-bezier(0.12, 0.96, 0.24, 1) 0.42s forwards;
    }
    .lane-2-content {
      position: absolute;
      bottom: -2vh;
      left: 0;
      display: flex;
      gap: 5vw;
      font-family: 'Valorant', sans-serif;
      font-size: 27vh;
      line-height: 1;
      color: var(--val-dark);
      transform: rotate(180deg);
      transform-origin: center center;
      white-space: nowrap;
      will-change: transform;
      animation: lane2GlideLeft 0.95s cubic-bezier(0.12, 0.96, 0.24, 1) 0.42s both;
    }
    @keyframes lane2GlideLeft {
      0%   { transform: rotate(180deg) translateX(-25vw); opacity: 0; }
      1%   { opacity: 1; }
      100% { transform: rotate(180deg) translateX(10vw); opacity: 1; }
    }

    /* Core Lane 3 (Lower Middle - Upright) */
    .lane-3-container {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 28%;
      overflow: hidden;
      z-index: 70;
      opacity: 0;
      animation: laneReveal 0.95s cubic-bezier(0.12, 0.96, 0.24, 1) 0.42s forwards;
    }
    .lane-3-content {
      position: absolute;
      top: -2vh;
      left: 0;
      display: flex;
      gap: 5vw;
      font-family: 'Valorant', sans-serif;
      font-size: 27vh;
      line-height: 1;
      color: var(--val-dark);
      white-space: nowrap;
      will-change: transform;
      animation: lane3GlideRight 0.95s cubic-bezier(0.12, 0.96, 0.24, 1) 0.42s both;
    }
    @keyframes lane3GlideRight {
      0%   { transform: translateX(-15vw); opacity: 0; }
      1%   { opacity: 1; }
      100% { transform: translateX(12vw); opacity: 1; }
    }
    @keyframes laneReveal {
      0%   { opacity: 0; }
      1%   { opacity: 1; }
      100% { opacity: 1; }
    }

    /* ----------------------------------------------------
       LANE 1 (Top Edge Ceiling): Upright FAHIM
       Sequentially pops letter-by-letter (Frame 271-274)!
       ---------------------------------------------------- */
    .lane-1-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 12%;
      overflow: hidden;
      z-index: 70;
      opacity: 0;
      animation: laneReveal 0.85s cubic-bezier(0.12, 0.96, 0.24, 1) 0.55s forwards;
    }
    .lane-1-content {
      position: absolute;
      bottom: -15vh;
      left: 0;
      display: flex;
      gap: 4vw;
      font-family: 'Valorant', sans-serif;
      font-size: 24vh;
      line-height: 1;
      color: var(--val-dark);
      white-space: nowrap;
      will-change: transform;
      animation: lane1GlideRight 0.85s cubic-bezier(0.12, 0.96, 0.24, 1) 0.55s forwards;
    }
    @keyframes lane1GlideRight {
      0%   { transform: translateX(-18vw); }
      100% { transform: translateX(6vw); }
    }

    /* ----------------------------------------------------
       LANE 4 (Bottom Edge Floor): 180° Inverted FAHIM
       Sequentially pops letter-by-letter (Frame 271-274)!
       ---------------------------------------------------- */
    .lane-4-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12%;
      overflow: hidden;
      z-index: 70;
      opacity: 0;
      animation: laneReveal 0.85s cubic-bezier(0.12, 0.96, 0.24, 1) 0.55s forwards;
    }
    .lane-4-content {
      position: absolute;
      top: -15vh;
      left: 0;
      display: flex;
      gap: 4vw;
      font-family: 'Valorant', sans-serif;
      font-size: 24vh;
      line-height: 1;
      color: var(--val-dark);
      transform: rotate(180deg);
      transform-origin: center center;
      white-space: nowrap;
      will-change: transform;
      animation: lane4GlideLeft 0.85s cubic-bezier(0.12, 0.96, 0.24, 1) 0.55s forwards;
    }
    @keyframes lane4GlideLeft {
      0%   { transform: rotate(180deg) translateX(-30vw); }
      100% { transform: rotate(180deg) translateX(10vw); }
    }

    /* ========================================================
       MICRO-DETAILS & HUD (Frames 265 - 282)
       ======================================================== */
    .hud-label {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: rgba(15, 25, 35, 0.75);
      z-index: 85;
    }

    .micro-dash {
      position: absolute;
      height: 3px;
      background: var(--val-dark);
      z-index: 85;
    }

    .micro-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--val-dark);
      z-index: 85;
    }

    /* Replay Button */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show { opacity: 1; }
    .btn {
      background: rgba(15,25,35,0.85);
      border: 1px solid rgba(255,255,255,0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.25em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-dark);
      border-color: var(--val-white);
      color: var(--val-red);
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <!-- Background Audio -->
  <video id="reveal-media" style="display:none;" preload="auto">
    <source src="../Valorant logo reveal animation _Project A_ - Trim.mp4" type="video/mp4" />
    <source src="../reveal_audio.webm" type="audio/webm" />
  </video>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V17 // FAHIM GEOMETRIC DECONSTRUCTION</div>
      <div class="splash-sub">CLICK TO PLAY TRUE PIECE-BY-PIECE LETTER GENESIS</div>
    </div>
  </div>

  <!-- Master Stage -->
  <div id="stage">
    <div class="hairline-axis"></div>

    <!-- Center Static Elements from Frames 265-282 -->
    <div class="left-chevron-pip"></div>
    <div class="center-stem-left"></div>
    <div class="center-stem-right"></div>

    <!-- ========================================================
         PHASE 1: THE TWO INITIAL CENTER ANCHOR BARS (Frame 265)
         ======================================================== -->
    <div class="anchor-left" id="anchor-left"></div>
    <div class="anchor-right" id="anchor-right"></div>

    <!-- ========================================================
         PHASE 2: REAL GEOMETRIC PIECES FORMING "FAHIM" (Frames 266-270)
         Strokes, blades, pillars, and wedges locking together into letters
         ======================================================== -->
    <div class="geo-build-container" id="geo-build">
      <!-- Letter F: Stem + Bars -->
      <div class="geo-part f-stem"></div>
      <div class="geo-part f-top-bar"></div>
      <div class="geo-part f-mid-bar"></div>

      <!-- Letter A: Left Blade + Right Blade + Crossbar -->
      <div class="geo-part a-blade-l"></div>
      <div class="geo-part a-blade-r"></div>
      <div class="geo-part a-crossbar"></div>

      <!-- Letter H: Left Pillar + Right Pillar + Bridge -->
      <div class="geo-part h-pillar-l"></div>
      <div class="geo-part h-pillar-r"></div>
      <div class="geo-part h-bridge"></div>

      <!-- Letter I: Solid Pillar -->
      <div class="geo-part i-pillar"></div>

      <!-- Letter M: Pillars + Diagonals -->
      <div class="geo-part m-pillar-l"></div>
      <div class="geo-part m-diag-l"></div>
      <div class="geo-part m-diag-r"></div>
      <div class="geo-part m-pillar-r"></div>
    </div>

    <!-- ========================================================
         PHASE 3: 4-LANE KINETIC HIGHWAY TAKEOVER (Frames 270 - 282)
         Once pieces lock together, the highway streams!
         ======================================================== -->

    <!-- LANE 2: Upper-Middle 180° Inverted FAHIM, Slides LEFT -->
    <div class="lane-2-container" id="lane-2">
      <div class="lane-2-content">
        <span>FAHIM</span>
        <span>FAHIM</span>
      </div>
    </div>

    <!-- LANE 3: Lower-Middle Upright FAHIM, Slides RIGHT -->
    <div class="lane-3-container" id="lane-3">
      <div class="lane-3-content">
        <span>FAHIM</span>
        <span>FAHIM</span>
      </div>
    </div>

    <!-- LANE 1 (Top Edge Ceiling): Upright FAHIM, Slides RIGHT -->
    <div class="lane-1-container" id="lane-1">
      <div class="lane-1-content">
        <span>FAHIM</span>
        <span>FAHIM</span>
      </div>
    </div>

    <!-- LANE 4 (Bottom Edge Floor): 180° Inverted FAHIM, Slides LEFT -->
    <div class="lane-4-container" id="lane-4">
      <div class="lane-4-content">
        <span>FAHIM</span>
        <span>FAHIM</span>
      </div>
    </div>

    <!-- Technical HUD Details (from Frames 265-282) -->
    <div class="micro-dash" style="top: 24%; left: 5%; width: 56px;"></div>
    <div class="micro-dash" style="top: 24%; right: 9%; width: 56px;"></div>
    <div class="micro-dash" style="top: 70%; right: 9%; width: 64px;"></div>
    
    <div class="micro-dot" style="top: 36%; left: 16%;"></div>
    <div class="micro-dot" style="top: 36%; left: 32%;"></div>
    <div class="micro-dot" style="top: 66%; right: 16%;"></div>
    <div class="micro-dot" style="top: 74%; right: 16%;"></div>

    <div class="hud-label" style="top: 36%; left: 27%;">VLRNT // SWE_23</div>
    <div class="hud-label" style="top: 90%; left: 28%;">PRTCL // FAHIM</div>
    <div class="hud-label" style="top: 10%; right: 10%;">BIND // HAVEN</div>
    <div class="hud-label" style="top: 90%; right: 10%;">SUST // SWE</div>
  </div>

  <!-- Replay Button -->
  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">↺ REPLAY "FAHIM" GENESIS</button>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const media = document.getElementById('reveal-media');
    const stage = document.getElementById('stage');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    function startAudio() {
      try {
        media.currentTime = 10.0;
        const p = media.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      playGenesisSequence();
    });

    async function playGenesisSequence() {
      navBar.classList.remove('show');
      stage.style.display = 'none';

      // Reset all animations inside stage
      stage.querySelectorAll('*').forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });

      startAudio();
      stage.style.display = 'block';

      // 1.45s full build and highway duration
      await wait(1450);

      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playGenesisSequence();
    });
  </script>
</body>
</html>
