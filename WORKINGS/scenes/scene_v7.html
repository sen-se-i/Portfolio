<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE PROTOTYPE V7 // FRAMES 148 - 175 "M" GEOMETRY & ACTIVE SHAPES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
      --val-cyan: #00f5d4;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Valorant', sans-serif;
      position: relative;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.16) 3px,
        rgba(0, 0, 0, 0.16) 4px
      );
      pointer-events: none;
      z-index: 950;
    }

    /* 1-Click Unlock Gate */
    #start-splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #start-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255, 70, 85, 0.4);
      padding: 26px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 70, 85, 0.04);
      position: relative;
    }
    .splash-box::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red);
      border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: '';
      position: absolute;
      bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red);
      border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-size: 30px;
      letter-spacing: 0.25em;
      color: var(--val-white);
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.45em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* Master Stage: Deep Dark Navy (Frames 148-175) */
    #stage-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--val-dark);
      z-index: 50;
    }

    /* ============================================================
       THE EXACT "M" ARCHITECTURE (Frames 148 - 175)
       1. The Massive 45-degree Zig-Zag Chevron of 'M' (Apex at center)
       2. The Vertical Arm of 'M' (x: 58% to 68%)
       3. The Top Solid Square Block of 'M' (Top center)
       4. The Giant Circular 'O' Arc on the right
       5. ACTIVE MOVING BACKGROUND MICRO-SHAPES:
          - Floating Left Red Bar (x: 50 to 110px, y: 120px) drifting left
          - Top-Left Micro-Chevrons & Dots drifting diagonally
          - Micro Arrow Pip (x: 140px, y: 390px)
          - Center Cavity Micro Square (x: 533 -> 515px)
       ============================================================ */
    #m-scene-container {
      position: absolute;
      inset: 0;
      display: none;
      background: var(--val-dark);
      overflow: hidden;
    }

    /* Camera Pan & Jitter Wrapper */
    .m-camera-wrapper {
      position: absolute;
      inset: 0;
      will-change: transform;
      animation: mCameraPan 0.85s cubic-bezier(0.12, 0.8, 0.2, 1) forwards;
    }
    @keyframes mCameraPan {
      0% { transform: translate(30px, -10px); }
      100% { transform: translate(-25px, 5px); }
    }

    /* 1. The Giant Zig-Zag M Chevron (Frames 148-175 Exact) */
    .m-zigzag-chevron {
      position: absolute;
      left: 26%;
      top: -12%;
      bottom: -12%;
      width: 25%;
      background: var(--val-red);
      clip-path: polygon(
        42% 0%, 82% 0%, 100% 42%, 58% 88%,
        58% 100%, 0% 100%, 42% 42%, 0% 0%
      );
      will-change: transform;
      animation: mChevronSlam 0.5s cubic-bezier(0.12, 0.9, 0.2, 1) forwards;
    }
    @keyframes mChevronSlam {
      0% { transform: translate(-60px, 30px); opacity: 0.5; }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    /* 2. The Vertical Arm of 'M' */
    .m-vertical-arm {
      position: absolute;
      left: 58%;
      bottom: 0;
      width: 9%;
      height: 64%;
      background: var(--val-red);
      will-change: transform;
      animation: armSlideUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes armSlideUp {
      0% { transform: translateY(40px); }
      100% { transform: translateY(0); }
    }

    /* 3. The Top Solid Square Block of 'M' */
    .m-top-square-block {
      position: absolute;
      left: 67%;
      top: 6%;
      width: 95px;
      height: 105px;
      background: var(--val-red);
      will-change: transform;
      animation: blockSnapDown 0.45s cubic-bezier(0.15, 0.85, 0.25, 1) forwards;
    }
    @keyframes blockSnapDown {
      0% { transform: translateY(-45px); }
      100% { transform: translateY(0); }
    }

    /* 4. The Giant Circular 'O' Arc on the Right (Frames 148-175 Exact) */
    .m-right-o-arc {
      position: absolute;
      right: -8%;
      top: -15%;
      width: 440px;
      height: 680px;
      border: 85px solid var(--val-red);
      border-radius: 50%;
      will-change: transform;
      animation: arcDriftLeft 0.85s cubic-bezier(0.12, 0.8, 0.2, 1) forwards;
    }
    @keyframes arcDriftLeft {
      0% { transform: translateX(35px); }
      100% { transform: translateX(-15px); }
    }

    /* --- ACTIVE MOVING BACKGROUND MICRO-SHAPES (Frames 148-175) --- */

    /* Shape A: Floating Left Red Horizontal Indicator Bar (x: 50 -> 110px, y: 125px) */
    .m-micro-horiz-bar {
      position: absolute;
      top: 125px;
      left: 50px;
      width: 62px;
      height: 6px;
      background: var(--val-red);
      z-index: 85;
      will-change: transform;
      animation: leftBarSlide 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes leftBarSlide {
      0% { transform: translateX(25px); }
      100% { transform: translateX(0); }
    }

    /* Shape B: Micro Arrow Pip (y: 395px, x: 140px) */
    .m-micro-arrow-pip {
      position: absolute;
      top: 395px;
      left: 140px;
      width: 12px;
      height: 8px;
      background: var(--val-red);
      clip-path: polygon(0% 0%, 65% 0%, 100% 50%, 65% 100%, 0% 100%);
      z-index: 85;
      will-change: transform;
      animation: arrowPipDrift 0.75s linear forwards;
    }
    @keyframes arrowPipDrift {
      0% { transform: translateX(18px); }
      100% { transform: translateX(-10px); }
    }

    /* Shape C: Center Cavity Micro Square (pos: 533px -> 515px, y: 75px) */
    .m-micro-cavity-sq {
      position: absolute;
      top: 72px;
      left: 533px;
      width: 8px;
      height: 8px;
      background: var(--val-red);
      z-index: 85;
      will-change: transform;
      animation: cavitySqDrift 0.75s linear forwards;
    }
    @keyframes cavitySqDrift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-18px); } /* 533 - 18 = 515px exact! */
    }

    /* Shape D: Diagonal Hairline Construction Axis */
    .m-hairline-axis {
      position: absolute;
      width: 150vw;
      height: 1px;
      background: rgba(255, 70, 85, 0.25);
      top: 15%;
      left: -20%;
      transform: rotate(45deg);
      pointer-events: none;
      z-index: 60;
    }

    /* Small Floating Red Square Pips on Left */
    .m-pip-1 {
      position: absolute;
      top: 185px;
      left: 215px;
      width: 6px;
      height: 6px;
      background: var(--val-red);
      z-index: 80;
    }
    .m-pip-2 {
      position: absolute;
      bottom: 120px;
      left: 215px;
      width: 6px;
      height: 6px;
      background: var(--val-red);
      z-index: 80;
    }

    /* Technical HUD Coordinates */
    .m-coord {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.35em;
      color: rgba(255, 70, 85, 0.6);
      z-index: 80;
    }

    /* Replay Nav */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show {
      opacity: 1;
    }
    .btn {
      background: rgba(15, 25, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-red);
      border-color: var(--val-red);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>

  <!-- Audio -->
  <audio id="reveal-audio" preload="auto">
    <source src="../reveal_audio.webm" type="audio/webm" />
  </audio>

  <!-- 1-Click Gate -->
  <div id="start-splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V7 // "M" ARCHITECTURE</div>
      <div class="splash-sub">CLICK TO PLAY FRAMES 148 - 175 GEOMETRY</div>
    </div>
  </div>

  <div id="stage-container">

    <div id="m-scene-container">
      <div class="m-camera-wrapper">
        <!-- Structural 'M' & 'O' Elements -->
        <div class="m-zigzag-chevron"></div>
        <div class="m-vertical-arm"></div>
        <div class="m-top-square-block"></div>
        <div class="m-right-o-arc"></div>

        <!-- Exact Measured Moving Background Shapes -->
        <div class="m-hairline-axis"></div>
        <div class="m-micro-horiz-bar"></div>
        <div class="m-micro-arrow-pip"></div>
        <div class="m-micro-cavity-sq"></div>
        <div class="m-pip-1"></div>
        <div class="m-pip-2"></div>

        <!-- Coordinates -->
        <div class="m-coord" style="top: 36px; left: 285px;">// VLRNT // M_CONSTRUCT</div>
        <div class="m-coord" style="bottom: 36px; left: 285px;">COORD // 35.48.36.N // 139.45.03.E</div>
      </div>
    </div>

  </div>

  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">REPLAY "M" BUILD</button>
  </div>

  <script>
    const splash = document.getElementById('start-splash');
    const audio = document.getElementById('reveal-audio');
    const mScene = document.getElementById('m-scene-container');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      audio.currentTime = 2.45; // Audio timestamp for frame 148
      audio.play().catch(e => console.log('Audio playback:', e));
      runMSceneSequence();
    });

    async function runMSceneSequence() {
      mScene.style.display = 'none';
      navBar.classList.remove('show');

      // Re-trigger all animations cleanly
      const anims = mScene.querySelectorAll('div');
      anims.forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });

      mScene.style.display = 'block';
      await wait(850);

      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      runMSceneSequence();
    });
  </script>
</body>
</html>
