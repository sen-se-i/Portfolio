<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE PROTOTYPE V4 // "F" WITH DETAILED MOVING MICRO-SHAPES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
      --val-cyan: #00f5d4;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Valorant', sans-serif;
      position: relative;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.16) 3px,
        rgba(0, 0, 0, 0.16) 4px
      );
      pointer-events: none;
      z-index: 950;
    }

    /* 1-Click Audio Unlock Gate */
    #start-splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #start-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255, 70, 85, 0.4);
      padding: 26px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 70, 85, 0.04);
      position: relative;
    }
    .splash-box::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red);
      border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: '';
      position: absolute;
      bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red);
      border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-size: 30px;
      letter-spacing: 0.25em;
      color: var(--val-white);
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.45em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* Master Stage */
    #stage-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--val-dark);
      z-index: 50;
    }

    /* ============================================================
       PHASE 1: FRAMES 1 - 31 (Tactical Setup + Moving Tiny Shapes)
       ============================================================ */
    #phase-1 {
      position: absolute;
      inset: 0;
      display: none;
      background: var(--val-dark);
    }

    .p1-left-wall {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 20%;
      background: var(--val-red);
    }

    .p1-right-wedge {
      position: absolute;
      right: 0; bottom: 0;
      width: 65%;
      height: 90%;
      background: var(--val-red);
      clip-path: polygon(42% 0, 100% 0, 100% 100%, 0 100%);
      will-change: transform;
      animation: wedgeSlideLeft 0.52s linear forwards;
    }
    @keyframes wedgeSlideLeft {
      0% { transform: translateX(45px); }
      100% { transform: translateX(0); }
    }

    .p1-top-triangle {
      position: absolute;
      top: 0; left: 56%;
      width: 70px; height: 120px;
      background: var(--val-red);
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }

    .p1-double-chevrons {
      position: absolute;
      top: 38px;
      left: 130px;
      display: flex;
      gap: 5px;
      z-index: 90;
    }
    .chev-blade {
      width: 11px;
      height: 16px;
      background: var(--val-red);
      clip-path: polygon(0 0, 50% 0, 100% 100%, 50% 100%);
    }

    .p1-dynamic-pip {
      position: absolute;
      top: 118px;
      left: 378px;
      width: 12px;
      height: 12px;
      background: var(--val-red);
      z-index: 90;
      will-change: transform;
      animation: pipDriftLeft 0.52s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes pipDriftLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-65px); }
    }

    .p1-dynamic-arrow {
      position: absolute;
      top: 136px;
      left: 546px;
      width: 16px;
      height: 11px;
      background: var(--val-red);
      clip-path: polygon(0% 0%, 65% 0%, 100% 50%, 65% 100%, 0% 100%);
      z-index: 90;
      will-change: transform;
      animation: arrowDriftLeft 0.52s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }
    @keyframes arrowDriftLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-21px); }
    }

    /* ============================================================
       PHASE 2: FRAMES 35 - 64 ("F" Kinetic Assembly & Moving Micro-Details)
       Background Crimson Red.
       Full Suite of Measured Tiny Moving Details INSIDE the "F" Scene:
       1. Top-Right Black Double Chevrons drifting left (pos: 948 -> 924px)
       2. Floating 80px Horizontal Bar drifting left & up (pos: 623->600px, 73->59px)
       3. Center Arrow Pip drifting left (pos: 597 -> 495px)
       4. Lower Square Pip drifting left (pos: 501 -> 478px)
       5. Right Edge 20px Technical Block
       ============================================================ */
    #phase-2 {
      position: absolute;
      inset: 0;
      display: none;
      background: var(--val-red);
      overflow: hidden;
    }

    .f-push-wrapper {
      position: absolute;
      inset: 0;
      will-change: transform;
      animation: cameraLeftToRightPush 0.8s cubic-bezier(0.12, 0.85, 0.25, 1) forwards;
    }
    @keyframes cameraLeftToRightPush {
      0% { transform: translateX(-40px); }
      100% { transform: translateX(35px); }
    }

    /* 1. Heavy Left Spine of 'F' */
    .f-main-spine {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 27%;
      background: var(--val-dark);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    /* 2. The Upper Beam of 'F' */
    .f-upper-beam {
      position: absolute;
      top: 0;
      left: 27%;
      width: 48%;
      height: 22%;
      background: var(--val-dark);
    }

    /* 3. Lower Crossbar Slab: Rises UP from bottom! */
    .f-lower-slab-motion {
      position: absolute;
      left: 41%;
      width: 24%;
      height: 48%;
      background: var(--val-dark);
      will-change: transform;
      animation: slabElevateUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slabElevateUp {
      0% { bottom: -50%; }
      100% { bottom: 0; }
    }

    /* 4. Right Side Opening Void: Slides away rightwards */
    .f-right-opening-void {
      position: absolute;
      right: 0;
      top: 32%;
      bottom: 0;
      width: 35%;
      background: var(--val-dark);
      will-change: transform, opacity;
      animation: rightSideOpen 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes rightSideOpen {
      0% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(75px); opacity: 0.25; }
    }

    /* --- THE MEASURED TINY DETAILS INSIDE "F" (Frames 35-64) --- */

    /* Detail A: Top-Right Dark Double Chevrons (x: 948 -> 924px, y: 56px) */
    .f-micro-chevrons {
      position: absolute;
      top: 48px;
      left: 74%;
      display: flex;
      gap: 5px;
      z-index: 80;
      will-change: transform;
      animation: darkChevDrift 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes darkChevDrift {
      0% { transform: translateX(24px); }
      100% { transform: translateX(0); }
    }
    .chev-blade-dark {
      width: 12px;
      height: 18px;
      background: var(--val-dark);
      clip-path: polygon(0 0, 50% 0, 100% 100%, 50% 100%);
    }

    /* Detail B: Floating 80px Horizontal Bar (Drifts leftwards and upwards: x 623->600, y 73->59) */
    .f-micro-horiz-bar {
      position: absolute;
      top: 72px;
      left: 48%;
      width: 80px;
      height: 4px;
      background: var(--val-dark);
      z-index: 80;
      will-change: transform;
      animation: barDriftUpLeft 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes barDriftUpLeft {
      0% { transform: translate(24px, 14px); }
      100% { transform: translate(0, 0); }
    }

    /* Detail C: Center Arrow Pip near F's middle cavity (x: 597 -> 495px, y: 231px) */
    .f-micro-arrow-pip {
      position: absolute;
      top: 226px;
      left: 46%;
      width: 14px;
      height: 10px;
      background: var(--val-dark);
      clip-path: polygon(0% 0%, 65% 0%, 100% 50%, 65% 100%, 0% 100%);
      z-index: 85;
      will-change: transform;
      animation: midArrowDrift 0.75s cubic-bezier(0.1, 0.85, 0.25, 1) forwards;
    }
    @keyframes midArrowDrift {
      0% { transform: translateX(75px); }
      100% { transform: translateX(0); }
    }

    /* Detail D: Lower Small Square Pip at Base (x: 501 -> 478px, y: 480px) */
    .f-micro-base-pip {
      position: absolute;
      bottom: 50px;
      left: 39%;
      width: 7px;
      height: 7px;
      background: var(--val-dark);
      z-index: 85;
      will-change: transform;
      animation: basePipDrift 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes basePipDrift {
      0% { transform: translateX(23px); }
      100% { transform: translateX(0); }
    }

    /* Detail E: Right Side Sliding 20px Block (x: 1164 -> 1152px, y: 267px) */
    .f-micro-right-sq {
      position: absolute;
      top: 50%;
      right: 90px;
      width: 20px;
      height: 20px;
      background: var(--val-dark);
      z-index: 80;
      animation: rightSqSlide 0.75s cubic-bezier(0.15, 0.8, 0.2, 1) forwards;
    }
    @keyframes rightSqSlide {
      0% { transform: translateX(25px); }
      100% { transform: translateX(0); }
    }

    /* Detail F: Thin Hairline Axis crossing F diagonally */
    .f-diagonal-axis {
      position: absolute;
      width: 140vw;
      height: 1px;
      background: rgba(15, 25, 35, 0.35);
      top: 15%;
      left: -20%;
      transform: rotate(45deg);
      pointer-events: none;
      z-index: 60;
    }

    /* Replay Nav */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show {
      opacity: 1;
    }
    .btn {
      background: rgba(15, 25, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-dark);
      border-color: var(--val-white);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>

  <!-- Audio -->
  <audio id="reveal-audio" preload="auto">
    <source src="../reveal_audio.webm" type="audio/webm" />
  </audio>

  <!-- 1-Click Unlock Gate -->
  <div id="start-splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V4 // "F" COMPLETE</div>
      <div class="splash-sub">CLICK TO PLAY WITH ALL MOVING MICRO-SHAPES</div>
    </div>
  </div>

  <div id="stage-container">

    <!-- ==========================================
         PHASE 1: FRAMES 1 - 31 (Dynamic Tiny Shapes)
         ========================================== -->
    <div id="phase-1">
      <div class="p1-left-wall"></div>
      <div class="p1-right-wedge"></div>
      <div class="p1-top-triangle"></div>

      <div class="p1-double-chevrons">
        <div class="chev-blade"></div>
        <div class="chev-blade"></div>
      </div>

      <div class="p1-dynamic-pip"></div>
      <div class="p1-dynamic-arrow"></div>
    </div>

    <!-- ==========================================
         PHASE 2: FRAMES 35 - 64 (The "F" Build + All Moving Details)
         ========================================== -->
    <div id="phase-2">
      <!-- Major Structure Push -->
      <div class="f-push-wrapper">
        <div class="f-main-spine"></div>
        <div class="f-upper-beam"></div>
        <div class="f-lower-slab-motion" id="f-slab"></div>
        <div class="f-right-opening-void" id="right-void"></div>
      </div>

      <!-- ALL PRECISE MOVING MICRO-SHAPES INSIDE "F" -->
      <div class="f-diagonal-axis"></div>
      
      <!-- 1. Top Right Chevrons drifting left -->
      <div class="f-micro-chevrons">
        <div class="chev-blade-dark"></div>
        <div class="chev-blade-dark"></div>
      </div>

      <!-- 2. Floating 80px Bar drifting left & up -->
      <div class="f-micro-horiz-bar"></div>

      <!-- 3. Center Arrow Pip drifting left -->
      <div class="f-micro-arrow-pip"></div>

      <!-- 4. Lower Base Pip drifting left -->
      <div class="f-micro-base-pip"></div>

      <!-- 5. Right Side 20px Block -->
      <div class="f-micro-right-sq"></div>
    </div>

  </div>

  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">REPLAY "F" BUILD</button>
  </div>

  <script>
    const splash = document.getElementById('start-splash');
    const audio = document.getElementById('reveal-audio');
    const phase1 = document.getElementById('phase-1');
    const phase2 = document.getElementById('phase-2');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');
    const fSlab = document.getElementById('f-slab');
    const rightVoid = document.getElementById('right-void');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      audio.currentTime = 0;
      audio.play().catch(e => console.log('Audio playback:', e));
      runFBuildSequence();
    });

    async function runFBuildSequence() {
      phase1.style.display = 'none';
      phase2.style.display = 'none';
      navBar.classList.remove('show');

      /* Phase 1: Frames 1 to 31 (~520ms) */
      phase1.style.display = 'block';
      await wait(520);
      phase1.style.display = 'none';

      /* Phase 2: Frames 35 to 64 (~750ms) */
      fSlab.style.animation = 'none';
      rightVoid.style.animation = 'none';
      fSlab.offsetHeight;
      rightVoid.offsetHeight;
      fSlab.style.animation = 'slabElevateUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards';
      rightVoid.style.animation = 'rightSideOpen 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards';

      phase2.style.display = 'block';
      await wait(780);

      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      runFBuildSequence();
    });
  </script>
</body>
</html>
