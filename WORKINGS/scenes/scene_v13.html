<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE V13 // FRAMES 255 - 264 // "AHAMMAD" OPPOSING TRACKS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Valorant';
      src: url('../valorant_font/Valorant Font.ttf') format('truetype');
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --val-red: #ff4655;
      --val-dark: #0f1923;
      --val-black: #080c10;
      --val-white: #ffffff;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--val-black);
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }

    /* Cinematic Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 900;
    }

    /* Splash Gate */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--val-black);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-box {
      border: 1px solid rgba(255,70,85,0.4);
      padding: 28px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: rgba(255,70,85,0.04);
      position: relative;
    }
    .splash-box::before {
      content: ''; position: absolute; top: -3px; left: -3px;
      width: 12px; height: 12px;
      border-top: 3px solid var(--val-red); border-left: 3px solid var(--val-red);
    }
    .splash-box::after {
      content: ''; position: absolute; bottom: -3px; right: -3px;
      width: 12px; height: 12px;
      border-bottom: 3px solid var(--val-red); border-right: 3px solid var(--val-red);
    }
    .splash-title {
      font-family: 'Valorant', sans-serif;
      font-size: 26px;
      letter-spacing: 0.22em;
      color: var(--val-white);
      text-align: center;
    }
    .splash-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--val-red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }

    /* ========================================================
       MASTER STAGE: FRAMES 255 - 264 (DEEP DARK NAVY + RADIANT RED)
       ======================================================== */
    #stage {
      position: fixed;
      inset: 0;
      background: var(--val-dark);
      overflow: hidden;
      display: none;
      z-index: 50;
    }

    /* 45-degree Thin Faint Hairline across Center Void */
    .hairline-axis {
      position: absolute;
      width: 180vw;
      height: 1px;
      background: rgba(255, 70, 85, 0.22);
      top: 8%;
      left: -20%;
      transform: rotate(45deg);
      transform-origin: top left;
      pointer-events: none;
      z-index: 60;
    }

    /* 
       TOP TRACK: Clipped at y = 36% (approx 190px of 534px)
       Holds massive "... A M M A D" in solid radiant red
    */
    .track-top-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36%;
      overflow: hidden;
      z-index: 70;
    }

    .track-top-content {
      position: absolute;
      bottom: -6vh;
      left: 0;
      display: flex;
      gap: 6vw;
      font-family: 'Valorant', sans-serif;
      font-size: 50vh;
      line-height: 1;
      color: var(--val-red);
      will-change: transform;
      animation: topTrackDrift 1.2s cubic-bezier(0.12, 0.96, 0.24, 1) forwards;
    }
    @keyframes topTrackDrift {
      0%   { transform: translateX(4vw); }
      100% { transform: translateX(18vw); }
    }

    /* 
       BOTTOM TRACK: Starts at y = 68% down to 100%
       Holds massive "A H A M M ..." in solid radiant red (Counter Drift)
    */
    .track-bot-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 33%;
      overflow: hidden;
      z-index: 70;
    }

    .track-bot-content {
      position: absolute;
      top: -2vh;
      left: 0;
      display: flex;
      gap: 6vw;
      font-family: 'Valorant', sans-serif;
      font-size: 50vh;
      line-height: 1;
      color: var(--val-red);
      will-change: transform;
      animation: botTrackDrift 1.2s cubic-bezier(0.12, 0.96, 0.24, 1) forwards;
    }
    @keyframes botTrackDrift {
      0%   { transform: translateX(8vw); }
      100% { transform: translateX(-6vw); }
    }

    /* ========================================================
       CENTER APERTURE VOID & MICRO-ELEMENTS (Frames 255 - 264)
       ======================================================== */

    /* Fast Shooting Red Arrow Pip (Frames 261-264 dynamic) */
    .center-arrow-pip {
      position: absolute;
      top: 48%;
      left: 45%;
      width: 17px;
      height: 12px;
      background: var(--val-red);
      clip-path: polygon(0% 15%, 65% 15%, 100% 50%, 65% 85%, 0% 85%);
      z-index: 80;
      will-change: transform;
      animation: arrowPipShoot 1.1s cubic-bezier(0.15, 0.9, 0.2, 1) 0.1s forwards;
    }
    @keyframes arrowPipShoot {
      0%   { transform: translateX(0); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translateX(28vw); opacity: 1; }
    }

    /* Small technical red bar */
    .micro-dash {
      position: absolute;
      top: 46%;
      right: 18%;
      width: 42px;
      height: 3px;
      background: var(--val-red);
      opacity: 0.6;
      z-index: 75;
    }

    /* Small technical pip dot */
    .micro-pip {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--val-red);
      z-index: 75;
    }

    /* Technical HUD Labels */
    .hud-label {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: rgba(255, 70, 85, 0.55);
      z-index: 85;
    }

    /* Replay Nav */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      right: 36px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.show { opacity: 1; }
    .btn {
      background: rgba(15,25,35,0.85);
      border: 1px solid rgba(255,255,255,0.35);
      color: var(--val-white);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.25em;
      padding: 9px 18px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--val-red);
      border-color: var(--val-red);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <!-- Audio from Trimmed Video -->
  <video id="reveal-media" style="display:none;" preload="auto">
    <source src="../Valorant logo reveal animation _Project A_ - Trim.mp4" type="video/mp4" />
    <source src="../reveal_audio.webm" type="audio/webm" />
  </video>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-box">
      <div class="splash-title">SCENE V13 // AHAMMAD OPPOSING SNAP</div>
      <div class="splash-sub">CLICK TO PLAY FRAMES 255 - 264 ARCHITECTURE</div>
    </div>
  </div>

  <!-- Master Stage -->
  <div id="stage">
    <div class="hairline-axis"></div>

    <!-- TOP TRACK: "... A M M A D" -->
    <div class="track-top-container">
      <div class="track-top-content" id="top-content">
        <span>A</span>
        <span>M</span>
        <span>M</span>
        <span>A</span>
        <span>D</span>
      </div>
    </div>

    <!-- BOTTOM TRACK: "A H A M M ..." -->
    <div class="track-bot-container">
      <div class="track-bot-content" id="bot-content">
        <span>A</span>
        <span>H</span>
        <span>A</span>
        <span>M</span>
        <span>M</span>
      </div>
    </div>

    <!-- CENTER APERTURE VOID MICRO-DETAILS -->
    <div class="center-arrow-pip" id="arrow-pip"></div>
    <div class="micro-dash"></div>
    <div class="micro-pip" style="top: 40%; left: 38%;"></div>
    <div class="micro-pip" style="top: 54%; right: 28%;"></div>

    <!-- Technical HUD Text -->
    <div class="hud-label" style="top: 42%; left: 42%;">// AHAMMAD // PROTOCOL</div>
    <div class="hud-label" style="top: 54%; left: 42%;">SYS_ID // SWE_23</div>
    <div class="hud-label" style="top: 44%; right: 12%;">SUST // CSE_SUST</div>
    <div class="hud-label" style="bottom: 35%; right: 60px;">AXIS // PARALLEL_SPLIT</div>
  </div>

  <!-- Replay Button -->
  <div class="nav-bar" id="nav-bar">
    <button class="btn" id="replay-btn">↺ REPLAY "AHAMMAD" SNAP</button>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const media = document.getElementById('reveal-media');
    const stage = document.getElementById('stage');
    const navBar = document.getElementById('nav-bar');
    const replayBtn = document.getElementById('replay-btn');

    const topContent = document.getElementById('top-content');
    const botContent = document.getElementById('bot-content');
    const arrowPip = document.getElementById('arrow-pip');

    const wait = ms => new Promise(res => setTimeout(res, ms));

    function startAudio() {
      try {
        media.currentTime = 9.85;
        const p = media.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }

    splash.addEventListener('click', () => {
      splash.classList.add('hide');
      playAhammadSnap();
    });

    async function playAhammadSnap() {
      navBar.classList.remove('show');
      stage.style.display = 'none';

      // Reset animations
      [topContent, botContent, arrowPip].forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight; // reflow
        el.style.animation = '';
      });

      startAudio();
      stage.style.display = 'block';

      // 1.25s cinematic drift
      await wait(1300);

      navBar.classList.add('show');
    }

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playAhammadSnap();
    });
  </script>
</body>
</html>
